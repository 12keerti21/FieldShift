<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldShift</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ═══════════════════════════════════════════════════════════════ tokens ═══ */
:root{
  /* ── Terra: a deep botanical base, one warm accent, and a semantic set for
     the six measures so a number's colour tells you what it is before you
     read the label. ───────────────────────────────────────────────────── */
  --forest:#12332B; --leaf:#1E9E6A; --leaf-soft:#E6F4EC; --sage:#D4E8DA;
  --ink:#101614; --ink-2:#35433E; --muted:#68776F; --faint:#97A49D;
  --line:#E3E8E4; --line-2:#EFF3F0; --bg:#F6F8F5; --panel:#fff; --raise:#FAFCF9;
  --brand:var(--forest); --accent:var(--leaf);
  --good:#15854F; --good-bg:#E6F4EC;
  --bad:#BE4A33; --bad-bg:#FBEDEA;
  --warn:#9C6B11; --warn-bg:#FCF4E3;
  --t1:#1E9E6A; --t2:#7257A8;
  /* semantic — one hue per measure */
  --m-production:#1E9E6A;   /* green, the crop            */
  --m-water:#2B7FB8;        /* blue, irrigation           */
  --m-carbon:#8A6A3F;       /* earth brown, soil          */
  --m-wind:#C98A2B;         /* amber, erosion risk        */
  --m-bare:#B07A4E;         /* tan, exposed soil          */
  --m-risk:#7257A8;         /* violet, the bad year       */
  --sh-1:0 1px 2px rgba(18,25,23,.04);
  --sh-2:0 2px 4px rgba(18,25,23,.04), 0 8px 24px rgba(18,25,23,.06);
  --sh-3:0 4px 8px rgba(18,25,23,.05), 0 16px 40px rgba(18,25,23,.09);
  --r:14px; --r-sm:9px; --r-xs:6px; --nav:244px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EEE9; --ink-2:#BECBC4; --muted:#8C9B94; --faint:#66746D;
    --line:#27322C; --line-2:#1E2723; --bg:#0D1311; --panel:#151C19; --raise:#1A231F;
    --brand:#27624F; --accent:#2FC488; --leaf-soft:#13271D; --sage:#1C2A22;
    --good:#3FC987; --good-bg:#112719;
    --bad:#EE7D66; --bad-bg:#291713;
    --warn:#DFAA44; --warn-bg:#29200F;
    --t1:#2FC488; --t2:#AE8CDC;
    --m-production:#2FC488; --m-water:#4FA8E0; --m-carbon:#C09A68;
    --m-wind:#E2AC55; --m-bare:#D1996E; --m-risk:#AE8CDC;
    --sh-1:0 1px 2px rgba(0,0,0,.3);
    --sh-2:0 2px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.26);
    --sh-3:0 4px 8px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E7EEE9; --ink-2:#BECBC4; --muted:#8C9B94; --faint:#66746D;
  --line:#27322C; --line-2:#1E2723; --bg:#0D1311; --panel:#151C19; --raise:#1A231F;
  --brand:#27624F; --accent:#2FC488; --leaf-soft:#13271D; --sage:#1C2A22;
  --good:#3FC987; --good-bg:#112719;
  --bad:#EE7D66; --bad-bg:#291713;
  --warn:#DFAA44; --warn-bg:#29200F;
  --t1:#2FC488; --t2:#AE8CDC;
  --m-production:#2FC488; --m-water:#4FA8E0; --m-carbon:#C09A68;
  --m-wind:#E2AC55; --m-bare:#D1996E; --m-risk:#AE8CDC;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.26);
  --sh-3:0 4px 8px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.4);
  color-scheme: dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.018em;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--leaf-soft);color:var(--brand)}

/* ═══════════════════════════════════════════════════════════ motion ═══ */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drawIn{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes popDot{from{opacity:0;transform:scale(0)}to{opacity:var(--o,1);transform:scale(1)}}

.stagger>*{animation:rise .5s var(--ease-out) both;
  animation-delay:calc(var(--i,0) * 45ms)}
.enter{animation:rise .42s var(--ease-out) both}
.enter-fade{animation:fade .3s var(--ease) both}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ═══════════════════════════════════════════════════════════ shell ═══ */
.app{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}
nav{background:var(--forest);color:#D5E4DC;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
:root[data-theme="dark"] nav{background:#0B1310}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav{background:#0B1310}}

.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;
  padding-top:calc(20px + env(safe-area-inset-top,0px))}
.navclose{display:none;margin-left:auto;background:none;border:0;color:#9FBCAE;
  font-size:22px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:var(--r-xs);
  transition:background .18s var(--ease),color .18s var(--ease)}
.navclose:hover{background:rgba(255,255,255,.1);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(6,14,11,.45);z-index:999;
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.mark{width:32px;height:32px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(140deg,#2FC184,#17764F);
  display:grid;place-items:center;color:#fff;font-weight:750;font-size:15px;
  box-shadow:0 2px 8px rgba(34,160,107,.35)}
.brand h1{font-size:17px;color:#fff;letter-spacing:-.02em}
.brand .tag{font-size:11px;color:#8FB3A2;margin-top:1px;letter-spacing:.01em}

.navsec{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:#6F9384;
  padding:16px 20px 7px;font-weight:680}
.navlist{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:0;color:#B6CCC1;padding:10px 12px;border-radius:var(--r-sm);
  cursor:pointer;font-size:13.5px;position:relative;
  transition:background .18s var(--ease),color .18s var(--ease),transform .14s var(--ease)}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.navbtn:active{transform:scale(.985)}
.navbtn.on{background:var(--leaf);color:#fff;font-weight:620;
  box-shadow:0 2px 10px rgba(34,160,107,.3)}
.navbtn .ni{width:17px;text-align:center;flex-shrink:0;font-size:13px;opacity:.85}
.navbtn.on .ni{opacity:1}
.navbtn .nn{flex:1;min-width:0}
.navbtn .nb{font-size:10px;background:rgba(255,255,255,.16);padding:1.5px 7px;
  border-radius:99px;font-variant-numeric:tabular-nums}
.navbtn.on .nb{background:rgba(0,0,0,.22)}

.fieldsel{padding:0 10px 4px}
.fs{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);
  border:1px solid transparent;color:#C5D8CE;border-radius:var(--r-sm);
  padding:9px 12px;cursor:pointer;font-size:12.5px;margin-bottom:4px;line-height:1.4;
  transition:background .18s var(--ease),border-color .18s var(--ease),transform .14s var(--ease)}
.fs:hover{background:rgba(255,255,255,.09)}
.fs:active{transform:scale(.99)}
.fs.on{background:rgba(34,160,107,.2);border-color:var(--leaf);color:#fff}
.fs .fn{font-weight:620;display:block;letter-spacing:-.01em}
.fs .ft{font-size:10.5px;color:#7FA695;margin-top:1px}
.fs.on .ft{color:#A9DCC3}

.navfoot{margin-top:auto;padding:16px 18px;font-size:11px;color:#7B9C8E;
  border-top:1px solid rgba(255,255,255,.08);line-height:1.5;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.navfoot button{background:none;border:1px solid rgba(255,255,255,.2);color:#B6CCC1;
  border-radius:var(--r-sm);padding:6px 11px;font-size:11.5px;cursor:pointer;
  margin-top:10px;transition:all .18s var(--ease)}
.navfoot button:hover{border-color:var(--leaf);color:#fff;background:rgba(34,160,107,.14)}

.stage{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:500;
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:13px 30px;display:flex;
  align-items:center;gap:13px;flex-wrap:wrap;
  padding-top:calc(13px + env(safe-area-inset-top,0px))}
.bar h2{font-size:17px}
.bar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.bar .sp{margin-left:auto}
.screen{padding:28px 30px 80px;max-width:1120px;width:100%}

/* ═══════════════════════════════════════════════════════════ atoms ═══ */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:680;
  text-transform:uppercase;letter-spacing:.07em;padding:4px 10px;border-radius:99px;
  background:var(--line-2);color:var(--muted);white-space:nowrap}
.pill.t1{background:var(--leaf-soft);color:var(--good)}
.pill.t2{background:color-mix(in srgb,var(--t2) 14%,transparent);color:var(--t2)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh-1);
  transition:box-shadow .24s var(--ease),border-color .24s var(--ease),
             transform .24s var(--ease)}
.card.raise{background:var(--raise)}
.card.hov:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.card h3{font-size:15px;margin-bottom:10px}

.sec{margin:34px 0 14px;display:flex;align-items:center;gap:12px}
.sec:first-child{margin-top:0}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);
  font-weight:680;white-space:nowrap}
.sec .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.lede{color:var(--ink-2);font-size:14.5px;max-width:68ch;margin:0 0 20px;line-height:1.65}

.note{border-left:3px solid var(--accent);background:var(--raise);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:13px 16px;margin:14px 0;
  font-size:13.8px;line-height:1.6}
.note b{color:var(--brand)}
:root[data-theme="dark"] .note b{color:var(--accent)}
.warn{border-left:3px solid var(--warn);background:var(--warn-bg);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:13px 16px;margin:14px 0;
  font-size:13.3px;line-height:1.6}
.warn b{color:var(--warn)}

/* ═══════════════════════════════════════════════════ the headline ═══ */
.answer{border-radius:var(--r);overflow:hidden;margin-bottom:22px;
  box-shadow:var(--sh-2);border:1px solid var(--line);background:var(--panel);
  animation:pop .5s var(--ease-out) both}
.answer .ah{background:linear-gradient(135deg,var(--forest),#1D5543);color:#fff;
  padding:10px 20px;font-size:10.5px;font-weight:680;text-transform:uppercase;
  letter-spacing:.11em;display:flex;align-items:center;gap:8px}
:root[data-theme="dark"] .answer .ah{background:linear-gradient(135deg,#17352B,#1D5543)}
.answer .ab{padding:22px 20px 20px}
.answer .big{font-size:27px;font-weight:660;line-height:1.2;margin-bottom:12px;
  letter-spacing:-.025em}
.answer .plain{font-size:14.5px;color:var(--ink-2);line-height:1.65;max-width:62ch}
.answer .plain b{color:var(--brand);font-weight:660}
:root[data-theme="dark"] .answer .plain b{color:var(--accent)}

.wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:4px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.win .wv{font-size:25px;font-weight:660;font-variant-numeric:tabular-nums;
  line-height:1.05;letter-spacing:-.03em}
.win .wv.up{color:var(--good)} .win .wv.down{color:var(--bad)}
.win .wk{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35}

/* ═══════════════════════════════════════════════════════ key stats ═══ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 16px;box-shadow:var(--sh-1);
  transition:transform .24s var(--ease),box-shadow .24s var(--ease)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--faint);font-weight:680}
.stat .v{font-size:21px;margin-top:5px;font-variant-numeric:tabular-nums;
  font-weight:640;letter-spacing:-.025em}
.stat .s{color:var(--muted);font-size:12px;font-weight:400;margin-top:2px;
  letter-spacing:0}

/* ════════════════════════════════════════════ progressive disclosure ═══ */
.disclose{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  margin-bottom:14px;overflow:hidden;box-shadow:var(--sh-1)}
.disclose>summary{cursor:pointer;padding:15px 20px;font-size:13.5px;font-weight:580;
  display:flex;align-items:center;gap:10px;list-style:none;user-select:none;
  transition:background .18s var(--ease)}
.disclose>summary::-webkit-details-marker{display:none}
.disclose>summary:hover{background:var(--raise)}
.disclose>summary::after{content:"";margin-left:auto;width:7px;height:7px;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:rotate(45deg) translateY(-2px);transition:transform .3s var(--ease)}
.disclose[open]>summary::after{transform:rotate(225deg) translateY(-2px)}
.disclose>summary .cnt{font-size:11px;color:var(--muted);font-weight:400;
  background:var(--line-2);padding:2px 8px;border-radius:99px}
.disclose .body{padding:0 20px 20px;animation:fade .34s var(--ease) both}

/* ═══════════════════════════════════════════════════════ rotations ═══ */
.rot{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  margin-bottom:10px;cursor:pointer;background:var(--panel);box-shadow:var(--sh-1);
  transition:border-color .22s var(--ease),box-shadow .22s var(--ease),
             transform .22s var(--ease)}
.rot:hover{border-color:var(--accent);box-shadow:var(--sh-2);transform:translateY(-2px)}
.rot:active{transform:translateY(0)}
.rot.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--sh-2)}
.rot.mine{background:var(--raise)}
.rot .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rot .rank{font-size:12px;font-weight:720;color:#fff;background:var(--faint);
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;flex-shrink:0}
.rot:first-of-type .rank{background:var(--accent)}
.rot .nm{font-weight:620;font-size:15px;flex:1;min-width:150px;letter-spacing:-.015em}
.rot .r2{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:11px;font-size:12.5px;
  color:var(--muted)}
.rot .r2 b{color:var(--ink);font-weight:640;font-variant-numeric:tabular-nums}
/* A measure's colour says what it is before the label is read. */
.rot .r2 span::before{content:"";display:inline-block;width:7px;height:7px;
  border-radius:2px;margin-right:6px;vertical-align:1px;background:var(--mc,var(--faint))}
.m-production{--mc:var(--m-production)} .m-water{--mc:var(--m-water)}
.m-carbon{--mc:var(--m-carbon)} .m-wind{--mc:var(--m-wind)}
.m-bare{--mc:var(--m-bare)} .m-risk{--mc:var(--m-risk)}
.win .wv.m-water{color:var(--m-water)} .win .wv.m-carbon{color:var(--m-carbon)}

/* calendar strip */
.cal{margin-top:13px}
.cal .months{display:flex;font-size:9px;color:var(--faint);margin-bottom:4px;
  letter-spacing:.04em}
.cal .months span{flex:1;text-align:center}
.calrow{position:relative;height:19px;background:var(--line-2);border-radius:5px;
  margin-bottom:4px;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;border-radius:5px;font-size:9.5px;color:#fff;
  display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;
  font-weight:620;transform-origin:left center;
  animation:growX .55s var(--ease-out) both;
  animation-delay:calc(var(--s,0) * 55ms)}
@keyframes growX{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.seg.irr::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 2px,transparent 2px 5px)}
.seg.pond::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 4px)}
.caltag{font-size:10px;color:var(--faint);min-width:32px;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);
  margin-top:9px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;
  margin-right:5px;vertical-align:-1px}

/* ═══════════════════════════════════════════════════════════ chart ═══ */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:2.3px;fill:var(--muted)}
.chart .axis{stroke:var(--line);stroke-width:.4}
.chart .pt{fill:var(--faint);opacity:.45;animation:popDot .5s var(--ease-out) both;
  animation-delay:calc(var(--i,0) * 7ms);transition:r .2s var(--ease)}
.chart .pt.front{fill:var(--accent);--o:.95;opacity:.95}
.chart .pt.sel{fill:var(--accent);stroke:var(--ink);stroke-width:.5;--o:1;opacity:1}
.chart .pt.mine{fill:var(--bad);stroke:var(--panel);stroke-width:.4;--o:1;opacity:1}
.chart .pt:hover{r:2.4}

/* ═══════════════════════════════════════════════════════ compare ═══ */
.cmp{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(252px,1fr))}
.cmp .col{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-1);
  transition:box-shadow .24s var(--ease),transform .24s var(--ease)}
.cmp .col:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.cmp .col.base{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.cmp .col.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--sh-2)}
.cmp .ch{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--raise)}
.cmp .ch .cl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  font-weight:680;color:var(--faint);margin-bottom:5px}
.cmp .ch h4{font-size:14px;line-height:1.35}
.cmp .cb{padding:14px 16px;flex:1}
.cmp .m{display:flex;justify-content:space-between;gap:10px;font-size:12.8px;
  padding:7px 0;border-bottom:1px solid var(--line-2)}
.cmp .m:last-of-type{border-bottom:0}
.cmp .m span{color:var(--muted)}
.cmp .m b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:620}
.cmp .m b.best{color:var(--good)}
.cmp .m b small{color:var(--faint);font-weight:400}

/* ═══════════════════════════════════════════════════════ flip card ═══ */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.flip{perspective:1500px;min-height:216px;cursor:pointer;
  animation:rise .5s var(--ease-out) both;animation-delay:calc(var(--i,0) * 55ms)}
.flip .inner{position:relative;width:100%;height:100%;min-height:216px;
  transition:transform .62s var(--ease-out);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;border:1px solid var(--line);
  border-radius:var(--r);padding:17px;background:var(--panel);display:flex;
  flex-direction:column;overflow:hidden;box-shadow:var(--sh-1)}
.flip:hover .face{box-shadow:var(--sh-2)}
.flip .back{transform:rotateY(180deg);background:var(--raise)}
.flip .ft{font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);font-weight:680;margin-bottom:8px}
.flip h4{font-size:14.5px;margin-bottom:8px;line-height:1.35}
.flip .fv{font-size:15px;font-weight:620;line-height:1.4;margin:2px 0 8px;
  color:var(--brand)}
:root[data-theme="dark"] .flip .fv{color:var(--accent)}
.flip .fd{font-size:12.5px;color:var(--ink-2);line-height:1.55;overflow-y:auto;flex:1}
.flip .fd p{margin:0 0 8px}
.flip .fm{margin-top:10px;font-size:10.5px;color:var(--faint);display:flex;
  align-items:center;gap:7px}
.flip .fm .turn{margin-left:auto;color:var(--accent);font-weight:640}
.flip code{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--line-2);padding:2px 6px;border-radius:var(--r-xs);
  color:var(--ink-2);word-break:break-all}
.flip.pass .face{border-top:3px solid var(--good)}
.flip.partial .face{border-top:3px solid var(--warn)}
.flip.fail .face{border-top:3px solid var(--bad)}

/* ═══════════════════════════════════════════════════════ controls ═══ */
.goals{display:flex;gap:9px;flex-wrap:wrap}
.goal{font-size:13px;padding:10px 15px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);border-radius:99px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sh-1);
  transition:all .2s var(--ease)}
.goal:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);
  box-shadow:var(--sh-2)}
.goal:active{transform:translateY(0) scale(.98)}
.goal.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:620;
  box-shadow:0 3px 12px rgba(34,160,107,.32)}
.goal .ico{font-size:14px;line-height:1}
.goalhint{font-size:12.8px;color:var(--muted);margin:13px 0 0;min-height:1.3em;
  animation:fade .3s var(--ease) both}

.pri{margin:16px 0}
.pri .top{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.pri .lbl{font-size:13.5px;font-weight:580}
.pri .dir{font-size:11px;color:var(--faint)}
.pri .num{margin-left:auto;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.pri .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:22px;cursor:grab}
input[type=range]:active{cursor:grabbing}

.field label{display:block;font-size:12.8px;font-weight:620;margin-bottom:6px}
.field .help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
input[type=text],input[type=number],select{font:inherit;font-size:13.5px;width:100%;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);color:var(--ink);transition:all .18s var(--ease)}
input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.rotpick{display:flex;flex-wrap:wrap;gap:7px}
.rotpick button{font-size:12.5px;padding:8px 13px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);border-radius:99px;cursor:pointer;
  transition:all .18s var(--ease)}
.rotpick button:hover{border-color:var(--accent);color:var(--accent);
  transform:translateY(-1px)}
.chosen{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:11px;
  min-height:34px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:7px 12px;
  border-radius:99px;background:var(--leaf-soft);color:var(--good);font-weight:580;
  animation:pop .3s var(--ease-out) both}
.chip b{font-weight:720;opacity:.55}
.chip button{background:none;border:0;cursor:pointer;font-size:15px;line-height:1;
  padding:0;opacity:.5;transition:opacity .15s}
.chip button:hover{opacity:1}

.row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button.primary{font-size:13.5px;font-weight:580;padding:11px 18px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:var(--r-sm);cursor:pointer;box-shadow:0 2px 10px rgba(34,160,107,.26);
  transition:all .2s var(--ease)}
button.primary:hover{filter:brightness(1.07);transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(34,160,107,.34)}
button.primary:active{transform:translateY(0) scale(.99)}
button.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
button.ghost{font-size:13.5px;padding:11px 18px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);border-radius:var(--r-sm);cursor:pointer;
  transition:all .2s var(--ease)}
button.ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

/* progress */
.prog{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden;
  margin:14px 0 9px}
.prog i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),#3FD39B);
  transition:width .7s var(--ease-out);position:relative}
.prog i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.stages{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.stg{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--muted);
  transition:color .3s var(--ease)}
.stg .tick{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);
  flex-shrink:0;display:grid;place-items:center;font-size:10px;
  transition:all .3s var(--ease)}
.stg.done{color:var(--ink-2)}
.stg.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.stg.now{color:var(--accent);font-weight:620}
.stg.now .tick{border-color:var(--accent);border-top-color:transparent;
  animation:spin .9s linear infinite}

/* skeleton */
.skel{height:14px;border-radius:var(--r-xs);margin:9px 0;
  background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 50%,var(--line-2) 75%);
  background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel.lg{height:28px;width:55%} .skel.sm{width:75%}
.loading{color:var(--muted);font-size:13.5px;padding:20px 0}

table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:0}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  font-weight:680}
td.n{font-variant-numeric:tabular-nums;text-align:right}
tbody tr{transition:background .15s var(--ease)}
tbody tr:hover{background:var(--raise)}

.ev ul{margin:8px 0 15px;padding-left:19px;color:var(--ink-2);font-size:13px;
  line-height:1.65}
.ev li{margin-bottom:7px}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:8px 0;
  user-select:none;transition:color .18s}
details.raw summary:hover{color:var(--accent)}
pre{white-space:pre-wrap;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--raise);border:1px solid var(--line);padding:15px;max-height:420px;
  overflow:auto;border-radius:var(--r-sm);color:var(--ink-2)}
.srcnote{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.55}

/* map */
#map,#pickmap{border-radius:var(--r);border:1px solid var(--line);overflow:hidden;
  position:relative;z-index:1;box-shadow:var(--sh-1)}
#map{height:min(52vh,480px);min-height:300px}
#pickmap{height:310px}
.maplegend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);
  margin-top:11px}
.maplegend i.mk{width:12px;height:12px;border-radius:50%;display:inline-block;
  margin-right:6px;vertical-align:-2px;border:2px solid var(--panel);
  box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.pinwrap{position:relative;width:20px;height:20px}
.pin{position:absolute;inset:0;border-radius:50%;border:2.5px solid #fff;
  box-shadow:0 2px 7px rgba(0,0,0,.35);transition:all .25s var(--ease)}
.pin.t1{background:#22A06B} .pin.t2{background:#7C5BB0}
.pin.on{transform:scale(1.18);
  box-shadow:0 0 0 6px rgba(34,160,107,.24),0 2px 7px rgba(0,0,0,.35)}
.pin.t2.on{box-shadow:0 0 0 6px rgba(124,91,176,.24),0 2px 7px rgba(0,0,0,.35)}
.leaflet-container{background:var(--bg);font:inherit}

.navtoggle{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav);z-index:1000;
    transform:translateX(-100%);transition:transform .3s var(--ease-out);
    box-shadow:var(--sh-3)}
  nav.open{transform:none}
  .navclose{display:block}
  body.navopen #scrim{opacity:1;pointer-events:auto}
  body.navopen{overflow:hidden}
  .navtoggle{display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border:1px solid var(--line);background:var(--panel);
    border-radius:var(--r-sm);cursor:pointer;font-size:15px}
  .screen{padding:20px 18px 60px}
  .bar{padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
}
@media (max-width:480px){
  .bar h2{font-size:15px} .bar .sub{display:none}
  .answer .big{font-size:21px} .answer .ab{padding:18px 16px}
  .win .wv{font-size:21px}
  .twocol{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="scrim" hidden></div>
<div class="app">

<nav id="nav">
  <div class="brand">
    <div class="mark">F</div>
    <div>
      <h1>FieldShift</h1>
      <div class="tag">Rethink What Grows Next</div>
    </div>
    <button class="navclose" id="navclose" aria-label="Close menu">&times;</button>
  </div>
  <div class="navsec">Field</div>
  <div class="fieldsel" id="fieldsel"></div>
  <div class="navsec">Analysis</div>
  <div class="navlist" id="navlist"></div>
  <div class="navfoot">
    FieldShift supports a decision; it does not make one.
    <button id="theme">Switch theme</button>
  </div>
</nav>

<div class="stage">
  <div class="bar">
    <button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button>
    <div>
      <h2 id="bar-title">Field</h2>
      <div class="sub" id="bar-sub"></div>
    </div>
    <span class="sp"></span>
    <span id="bar-pill"></span>
  </div>
  <div id="screens">
    <div class="screen">
      <div class="skel lg"></div><div class="skel"></div><div class="skel sm"></div>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

const KEYS = ["production","downside","irrigation","carbon","wind_exposure","bare_ground"];
const SCREENS = [
  {id:"analyse",    icon:"✛", name:"Analyse a field"},
  {id:"field",      icon:"◉", name:"Field"},
  {id:"rotations",  icon:"⌘", name:"Rotations"},
  {id:"compare",    icon:"⇄", name:"Compare"},
  {id:"evidence",   icon:"▤", name:"Evidence"},
  {id:"climate",    icon:"◈", name:"Climate stress"},
  {id:"validation", icon:"✓", name:"Validation"},
];
const state = {
  sites:[], siteId:null, bundle:null, rank:null, selected:null,
  screen:"field", weights:{}, goal:"balanced", validation:null,
  source:{kind:"site", id:null},
  regions:[], draft:{lat:null, lon:null, region:null, rotation:[], hectares:3},
  job:null, poll:null,
  scenarios:[], scenarioJob:null, scenarioPoll:null, scenarioResult:null,
};

const api = {
  rank:  () => state.source.kind === "job"
    ? `/api/analyse/${state.source.id}/rank` : "/api/rank",
  evidence: i => state.source.kind === "job"
    ? `/api/analyse/${state.source.id}/rotation/${i}/evidence`
    : `/api/site/${state.siteId}/rotation/${i}/evidence`,
  fieldplan: i => state.source.kind === "job"
    ? `/api/analyse/${state.source.id}/rotation/${i}/fieldplan`
    : `/api/site/${state.siteId}/rotation/${i}/fieldplan`,
};

const $ = s => document.querySelector(s);
const fmt = (v,d=2) => (v===null||v===undefined||Number.isNaN(Number(v)))
  ? "–" : Number(v).toFixed(d);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sign = (v,d) => (v>0?"+":"") + fmt(v, d===undefined ? (Math.abs(v)<1?3:2) : d);

const PRESETS = [
  {id:"balanced", icon:"⚖", label:"Balanced",
   hint:"Weigh everything equally — a good place to start.",
   w:{production:3,downside:3,irrigation:3,carbon:3,wind_exposure:3,bare_ground:3}},
  {id:"water", icon:"☔", label:"Save water",
   hint:"Cut irrigation hard, and accept giving up some output to do it.",
   w:{production:1,downside:2,irrigation:5,carbon:2,wind_exposure:1,bare_ground:2}},
  {id:"yield", icon:"❀", label:"Most output",
   hint:"Maximise what comes off the field, water allowing.",
   w:{production:5,downside:3,irrigation:1,carbon:1,wind_exposure:1,bare_ground:1}},
  {id:"soil", icon:"☘", label:"Build soil",
   hint:"Favour soil carbon, ground cover and protection from erosion.",
   w:{production:2,downside:2,irrigation:2,carbon:5,wind_exposure:4,bare_ground:5}},
  {id:"safe", icon:"⛨", label:"Lowest risk",
   hint:"Protect the bad year rather than the average year.",
   w:{production:2,downside:5,irrigation:3,carbon:2,wind_exposure:2,bare_ground:2}},
];
Object.assign(state.weights, PRESETS[0].w);

const PLAIN = {
  production:{k:"output",u:"t DM/ha/yr",up:true,d:2},
  downside:{k:"bad year",u:"t DM/ha/yr",up:true,d:2},
  irrigation:{k:"water",u:"mm/yr",up:false,d:0},
  carbon:{k:"soil carbon",u:"t C/ha/yr",up:true,d:3},
  wind_exposure:{k:"wind risk",u:"index",up:false,d:0},
  bare_ground:{k:"bare soil",u:"%",up:false,d:0},
};
const GROUP_COLOUR = {
  cereal:"#3C7FC4", grain_legume:"#22A06B", oilseed:"#C8921A", fibre:"#9B74B8",
  root_tuber:"#C2762C", green_manure:"#4A9E5A", cover_crop:"#76B45B",
  forage:"#4FA89A", fallow:"#A3AEA9",
};
const MONTHS = ["J","F","M","A","M","J","J","A","S","O","N","D"];

/* The drawer's open/closed state has exactly one owner. Three different places
   toggling a class is how it ended up openable with no way to close it. */
let setNav = () => {};

/* ───────────────────────────────────────────────────────────── chrome */
(function(){
  let saved=null; try{ saved=localStorage.getItem("fs-theme"); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  $("#theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur==="dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("fs-theme", next); }catch(e){}
  };
  // One function owns the drawer, because three places toggling a class is how
  // it ended up openable with no way back.
  const scrim = $("#scrim");
  setNav = open => {
    $("#nav").classList.toggle("open", open);
    document.body.classList.toggle("navopen", open);
    if(scrim) scrim.hidden = !open;
  };
  $("#navtoggle").onclick = () => setNav(!$("#nav").classList.contains("open"));
  $("#navclose").onclick = () => setNav(false);
  scrim.onclick = () => setNav(false);
  document.addEventListener("keydown", e => {
    if(e.key === "Escape") setNav(false);
  });
  // A drawer left open across a resize to desktop traps scrolling behind a
  // scrim nobody can see.
  window.addEventListener("resize", () => {
    if(window.innerWidth > 900) setNav(false);
  });
})();

async function get(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok){
    const b = await r.json().catch(()=>({detail:r.statusText}));
    throw new Error(b.detail || r.statusText);
  }
  return r.json();
}

/* Count a number up on mount. Pure decoration, so it degrades to the final
   value instantly if motion is reduced or anything goes wrong. */
function animateNumbers(root){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = parseFloat(el.dataset.count);
    if(!isFinite(target)) return;
    const dp = parseInt(el.dataset.dp || "0", 10);
    const pre = el.dataset.pre || "", post = el.dataset.post || "";
    const t0 = performance.now(), dur = 760;
    const tick = now => {
      const k = Math.min((now - t0) / dur, 1);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = pre + (target * eased).toFixed(dp) + post;
      if(k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function stagger(root){
  root.querySelectorAll(".stagger").forEach(g => {
    [...g.children].forEach((c, i) => c.style.setProperty("--i", i));
  });
  root.querySelectorAll(".flips").forEach(g => {
    [...g.children].forEach((c, i) => c.style.setProperty("--i", i));
  });
}

/* ───────────────────────────────────────────────────────────── nav */
function renderNav(){
  $("#navlist").innerHTML = SCREENS.map(s => {
    const badge = s.id==="rotations" && state.bundle
      ? `<span class="nb">${state.bundle.search.feasible}</span>` : "";
    return `<button class="navbtn ${s.id===state.screen?"on":""}"
      onclick="go('${s.id}')"><span class="ni">${s.icon}</span>
      <span class="nn">${esc(s.name)}</span>${badge}</button>`;
  }).join("");
  $("#fieldsel").innerHTML = state.sites.map(s => {
    const bits = s.name.split(",");
    return `<button class="fs ${s.id===state.siteId?"on":""}"
      onclick="selectSite('${s.id}')">
      <span class="fn">${esc(bits[0])}</span>
      <span class="ft">Tier ${s.tier}${bits[1]?" · "+esc(bits.slice(1).join(",").trim()):""}</span>
    </button>`;
  }).join("");
}

function go(id){
  state.screen = id;
  // Reflect the screen in the URL so a view can be linked to, reloaded, and
  // reached directly - including by a headless browser taking screenshots.
  try{ history.replaceState(null, "", "#" + id); }catch(e){}
  setNav(false);
  renderNav();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

async function boot(){
  try{
    const [sites, val, regs] = await Promise.all([
      get("/api/sites"), get("/api/validation").catch(()=>null),
      get("/api/regions").catch(()=>({regions:[]})),
    ]);
    state.sites = sites.sites;
    state.validation = val;
    state.regions = regs.regions || [];
    if(state.regions.length) state.draft.region = state.regions[0].id;
    get("/api/scenarios").then(r => { state.scenarios = r.scenarios || []; })
      .catch(()=>{});
    if(!state.sites.length) throw new Error("no bundles on disk");
    renderNav();
    const wanted = (location.hash || "").replace("#", "");
    await selectSite(state.sites[0].id);
    if(SCREENS.some(x => x.id === wanted)) go(wanted);
  }catch(e){
    $("#screens").innerHTML = `<div class="screen"><div class="warn">
      <b>No precomputed fields.</b> ${esc(e.message)}<br><br>
      Build one with <code>python -m fieldshift.api.bundle</code>.</div></div>`;
  }
}

async function selectSite(id){
  state.siteId = id; state.selected = null;
  setNav(false);
  state.source = {kind:"site", id};
  stopPolling(); stopScenarioPolling();
  state.scenarioJob = null; state.scenarioResult = null;
  state.bundle = await get("/api/site/" + id);
  renderNav();
  await rerank();
}

async function rerank(){
  state.rank = await get(api.rank(), {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({site_id:state.siteId || "live",
                          priorities:state.weights, limit:12}),
  });
  render();
}

function setGoal(id){
  const p = PRESETS.find(x=>x.id===id);
  if(!p) return;
  state.goal = id;
  Object.assign(state.weights, p.w);
  rerank();
}

let debounce;
function setWeight(k,v){
  state.goal = null;
  state.weights[k] = Number(v);
  const words = ["ignore","low","","","","top"];
  const el = $("#v-"+k);
  if(el) el.textContent = v + (words[v] ? " · " + words[v] : "");
  clearTimeout(debounce);
  debounce = setTimeout(rerank, 140);
}

/* ───────────────────────────────────────────────────────────── render */
function render(){
  const b = state.bundle;
  const sc = SCREENS.find(x=>x.id===state.screen);
  if(!b){
    $("#bar-title").textContent = "Analyse a field";
    $("#bar-sub").textContent = ""; $("#bar-pill").innerHTML = "";
    paint(screenAnalyse()); mountPicker(); return;
  }
  const s = b.site, reg = b.region || {tier:1, validated:true};
  $("#bar-title").textContent = sc ? sc.name : "Field";
  $("#bar-sub").textContent = s.name;
  $("#bar-pill").innerHTML = `<span class="pill t${reg.tier}"><span class="dot"></span>
    Tier ${reg.tier} · ${reg.validated?"validated":"transferred"}</span>`;
  const fn = {analyse:screenAnalyse, field:screenField, rotations:screenRotations,
              compare:screenCompare, evidence:screenEvidence,
              climate:screenClimate, validation:screenValidation}[state.screen];
  paint(fn());
  if(state.screen === "analyse") mountPicker();
  if(state.screen === "field") mountMap();
  if(state.screen === "rotations") mountScatter();
  if(state.screen === "evidence") loadEvidence();
  wireFlips();
}

function paint(html){
  const host = $("#screens");
  host.innerHTML = `<div class="screen enter">${html}</div>`;
  stagger(host); animateNumbers(host);
}

function tierBanner(reg){
  if(reg.validated) return "";
  return `<div class="warn">
    <b>Tier 2 — transferred, not validated.</b> ${esc(reg.note||"")}
    Same engine as the validated US fields, running on global inputs only.
    Read what follows as a hypothesis to test locally.</div>`;
}

/* ─────────────────────────────────────────────────────────── 1. Field */
function screenField(){
  const b = state.bundle, s = b.site, reg = b.region || {tier:1,validated:true};
  const ratio = s.rainfall_mm_yr > 0 ? s.weather.annual_et0_mm / s.rainfall_mm_yr : null;
  return `
    <p class="lede">${esc(s.note)}</p>
    ${tierBanner(reg)}
    ${headline()}

    <div class="sec"><h3>This field at a glance</h3><div class="rule"></div></div>
    <div class="stats stagger">
      <div class="stat" style="border-top:3px solid var(--m-water)"><div class="k">Rainfall</div>
        <div class="v"><span data-count="${s.rainfall_mm_yr}" data-dp="0">0</span>
        <span style="font-size:13px;color:var(--muted)">mm/yr</span>
        <div class="s">average over ${s.weather.years} years</div></div></div>
      <div class="stat" style="border-top:3px solid var(--m-wind)"><div class="k">Evaporative demand</div>
        <div class="v"><span data-count="${s.weather.annual_et0_mm}" data-dp="0">0</span>
        <span style="font-size:13px;color:var(--muted)">mm/yr</span>
        <div class="s">what the air wants to take</div></div></div>
      <div class="stat" style="border-top:3px solid var(--m-carbon)"><div class="k">Soil water store</div>
        <div class="v"><span data-count="${s.soil.available_water_mm_per_m}" data-dp="0">0</span>
        <span style="font-size:13px;color:var(--muted)">mm/m</span>
        <div class="s">${esc(s.soil.texture)}, ${s.soil.provenance==="survey"
          ? "surveyed" : s.soil.provenance==="prediction" ? "predicted" : "estimated"}</div></div></div>
    </div>

    ${ratio ? `<div class="note">The air wants about
      <b data-count="${ratio}" data-dp="1">0</b><b>×</b> more water than the sky
      delivers here${ratio > 2 ? ", so every rotation is really a decision about water"
        : ". Water is less often the binding constraint than at the drier fields"}.</div>` : ""}

    <details class="disclose">
      <summary>Everything else about this field <span class="cnt">4 more</span></summary>
      <div class="body"><table>
        <tr><td>Weather record</td><td class="n">${s.weather.years} years
          (${s.weather.first_year}–${s.weather.last_year}), gap-free</td></tr>
        <tr><td>Reference ET confidence</td><td class="n">${esc(s.weather.et0_confidence)}</td></tr>
        <tr><td>Slope</td><td class="n">${s.terrain.slope_percent===null
          ? "no DEM tile here" : fmt(s.terrain.slope_percent,2)+"% (planar fit, NASADEM)"}</td></tr>
        <tr><td>Soil source</td><td class="n">${esc(s.soil.source||"")}</td></tr>
      </table></div>
    </details>

    <div class="sec"><h3>Where these fields are</h3><div class="rule"></div></div>
    <div id="map"></div>
    <div class="maplegend">
      <span><i class="mk" style="background:#22A06B"></i>Tier 1 — validated</span>
      <span><i class="mk" style="background:#7C5BB0"></i>Tier 2 — transferred</span>

    <p class="srcnote">Click a marker to switch field.</p>`;
}

function mountMap(){
  const el = document.getElementById("map");
  if(!el || !window.L) return;
  const map = L.map(el, {scrollWheelZoom:true, worldCopyJump:true}).setView([25,30],2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:14, attribution:"&copy; OpenStreetMap"}).addTo(map);
  const pts = [];
  state.sites.forEach(s => {
    const icon = L.divIcon({className:"", iconSize:[20,20], iconAnchor:[10,10],
      html:`<div class="pinwrap"><div class="pin t${s.tier}${s.id===state.siteId?" on":""}"></div></div>`});
    L.marker([s.latitude, s.longitude], {icon}).addTo(map)
      .bindTooltip(`<b>${esc(s.name)}</b><br>Tier ${s.tier}`,
        {direction:"top", offset:[0,-8]})
      .on("click", () => selectSite(s.id));
    pts.push([s.latitude, s.longitude]);
  });
  if(pts.length) map.fitBounds(pts, {padding:[50,50], maxZoom:5});
  setTimeout(()=>map.invalidateSize(), 80);
}

/* ─────────────────────────────────────────────────────── the answer */
function headline(){
  const rank = state.rank;
  if(!rank || !rank.ranked.length) return "";
  const top = rank.ranked[0], mine = rank.existing;
  const name = esc(top.name.replace(/^EXISTING: /,""));
  if(top.is_existing){
    return `<div class="answer"><div class="ah">The answer for this field</div>
      <div class="ab"><div class="big">Keep what you are doing.</div>
      <div class="plain">On the priorities you set, <b>${name}</b> is already the
      best of the ${state.bundle.search.feasible} workable rotations simulated
      through ${state.bundle.site.weather.years} years of weather here.</div>
      </div></div>`;
  }
  let cells = "", parts = [];
  if(mine){
    ["irrigation","production","carbon","bare_ground"].forEach(k => {
      const m = PLAIN[k], a = top.objectives[k], e = mine.objectives[k];
      if(a===undefined || e===undefined) return;
      const diff = a - e;
      if(Math.abs(diff) < 1e-9) return;
      const better = m.up ? diff > 0 : diff < 0;
      const scale = k==="bare_ground" ? 100 : 1;
      const pct = Math.abs(e) > 1e-9 ? Math.abs(diff/e)*100 : null;
      cells += `<div class="win"><div class="wv ${better?"up":"down"}"
        data-count="${diff*scale}" data-dp="${m.d}" data-pre="${diff>0?"+":""}">0</div>
        <div class="wk">${m.k}<br>${esc(m.u)}</div></div>`;
      if(k==="irrigation" && better)
        parts.push(`<b>${fmt(Math.abs(diff),0)} mm/yr less irrigation water</b>` +
          (pct ? ` — about ${fmt(pct,0)}% of what this field uses now` : ""));
      if(k==="production" && pct !== null)
        parts.push(better ? `<b>${fmt(pct,0)}% more</b> coming off the field`
                          : `${fmt(pct,0)}% less coming off the field`);
      if(k==="carbon" && better) parts.push("soil carbon moving upward instead of down");
    });
  }
  return `<div class="answer"><div class="ah">The answer for this field</div>
    <div class="ab">
      <div class="big">Try ${name}.</div>
      <div class="plain">${parts.length ? "It would mean " + parts.join(", ") + "." : ""}
      ${rank.beaten_by.includes(top.name)
        ? ` Nothing is given up to get there — this beats your current rotation on
            <b>every</b> measure, not just on balance.`
        : rank.beaten_by.length
        ? ` This is the best fit to the priorities you set, but it does involve a
            real trade-off. ${rank.beaten_by.length} other rotation${rank.beaten_by.length>1?"s":""}
            beat${rank.beaten_by.length>1?"":"s"} your current one on every measure — reweight
            toward what you care about to see them.`
        : ` This is the best fit to the priorities you set, but it does involve a
            real trade-off.`}</div>
      ${cells ? `<div class="wins">${cells}</div>` : ""}
    </div></div>`;
}

/* ───────────────────────────────────────────────────── 2. Rotations */
function screenRotations(){
  const b = state.bundle, rank = state.rank;
  const cur = PRESETS.find(p=>p.id===state.goal);
  const by = {}; b.objectives.forEach(o => by[o.key]=o);
  const sliders = KEYS.filter(k=>by[k]).map(k => {
    const o = by[k], w = state.weights[k], words=["ignore","low","","","","top"];
    return `<div class="pri"><div class="top">
      <span class="lbl">${esc(o.label)}</span>
      <span class="dir">${o.maximise?"more is better":"less is better"}</span>
      <span class="num" id="v-${k}">${w}${words[w]?" · "+words[w]:""}</span></div>
      <input type="range" id="w-${k}" min="0" max="5" step="1" value="${w}"
        aria-label="${esc(o.label)} priority" oninput="setWeight('${k}',this.value)">
      <div class="hint">${esc(o.note)}</div></div>`;
  }).join("");
  const sens = rank.sensitivity.all_stable
    ? `<span class="pill good"><span class="dot"></span>stable</span>
       The leading choice holds even if you move any one priority by half.`
    : `<span class="pill warn"><span class="dot"></span>sensitive</span>
       The leading choice <b>changes</b> if you shift
       ${rank.sensitivity.deciding_priorities.map(esc).join(", ")} — your own
       weighting is deciding this, not a clear winner.`;

  const top = rank.ranked.slice(0, 3);
  const rest = rank.ranked.slice(3);

  return `
    <p class="lede">Every rotation below was simulated day by day through
      ${b.site.weather.years} years of real weather here. Tell FieldShift what you
      care about and the ranking moves instantly.</p>

    <div class="card">
      <div class="goals">${PRESETS.map(p =>
        `<button class="goal ${p.id===state.goal?"on":""}" onclick="setGoal('${p.id}')">
          <span class="ico">${p.icon}</span>${esc(p.label)}</button>`).join("")}</div>
      <div class="goalhint">${cur ? esc(cur.hint)
        : "Custom weighting — set from the sliders below."}</div>
    </div>
    <div class="note" style="border-left-color:var(--line)">${sens}</div>

    ${headline()}

    <div class="sec"><h3>Best three for these priorities</h3><div class="rule"></div></div>
    <div class="stagger">${top.map((r,i)=>rotCard(r,i+1)).join("")}</div>

    ${rest.length ? `<details class="disclose">
      <summary>More options <span class="cnt">${rest.length} more</span></summary>
      <div class="body stagger">${rest.map((r,i)=>rotCard(r,i+4)).join("")}</div>
    </details>` : ""}

    ${rank.existing && !rank.ranked.some(r=>r.is_existing)
      ? `<div class="sec"><h3>What you grow now</h3><div class="rule"></div></div>
         ${rotCard(rank.existing,null)}` : ""}

    <details class="disclose">
      <summary>Fine-tune the six measures <span class="cnt">advanced</span></summary>
      <div class="body">${sliders}</div>
    </details>

    <details class="disclose">
      <summary>The trade-off space <span class="cnt">chart</span></summary>
      <div class="body"><div id="scatter"></div></div>
    </details>

    <details class="disclose">
      <summary>How these options were found
        <span class="cnt">${b.search.examined} examined</span></summary>
      <div class="body"><table>
        <tr><td>rotation cycles examined</td><td class="n">${b.search.examined}</td></tr>
        <tr><td>physically feasible here</td><td class="n">${b.search.feasible}</td></tr>
        <tr><td>simulated through ${b.site.weather.years} years</td>
          <td class="n">${b.search.simulated}</td></tr>
        <tr><td>not beaten on every measure</td><td class="n">${b.search.on_front}</td></tr>
      </table>
      ${Object.keys(b.search.rejections||{}).length ? `<table style="margin-top:14px">
        <tr><th>rejected because</th><th class="n">count</th></tr>
        ${Object.entries(b.search.rejections).map(([k,v])=>
          `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("")}</table>
        <p class="srcnote">Nothing is discarded silently. Every rejection carries a
          reason a person can disagree with.</p>` : ""}
      </div>
    </details>`;
}

function rotCard(r, rank){
  const o = r.objectives;
  const rot = state.bundle.rotations.find(x=>x.index===r.index);
  return `<div class="rot ${r.is_existing?"mine":""} ${state.selected===r.index?"sel":""}"
    data-i="${r.index}" onclick="pickRotation(${r.index})">
    <div class="r1">
      ${rank ? `<span class="rank">${rank}</span>` : ""}
      <span class="nm">${esc(r.name.replace(/^EXISTING: /,""))}</span>
      ${r.is_existing?'<span class="pill bad">yours</span>':""}
      ${r.on_front?'<span class="pill good">not beaten</span>':""}</div>
    <div class="r2">
      <span class="m-production">output <b>${fmt(o.production)}</b> t DM/ha/yr</span>
      <span class="m-water">water <b>${fmt(o.irrigation,0)}</b> mm/yr</span>
      <span class="m-carbon">carbon <b>${sign(o.carbon,3)}</b></span>
      <span class="m-bare">bare <b>${fmt(o.bare_ground*100,0)}%</b></span></div>
    ${rot?calendar(rot):""}</div>`;
}

function pickRotation(i){ state.selected = i; go("compare"); }

function mountScatter(){
  const host = document.getElementById("scatter");
  if(!host) return;
  const b = state.bundle;
  const xs = b.rotations.map(r=>r.objectives.irrigation);
  const ys = b.rotations.map(r=>r.objectives.production);
  const W=100,H=56,PL=11,PR=3,PT=4,PB=8;
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const ymin=Math.min(...ys), ymax=Math.max(...ys);
  const sx=v=>PL+(xmax===xmin?(W-PL-PR)/2:(v-xmin)/(xmax-xmin)*(W-PL-PR));
  const sy=v=>H-PB-(ymax===ymin?(H-PT-PB)/2:(v-ymin)/(ymax-ymin)*(H-PT-PB));
  const pts = b.rotations.map((r,i)=>{
    const mine=r.is_existing;
    const cls = mine?"pt mine"
      :(state.selected===r.index?"pt sel":(r.on_front?"pt front":"pt"));
    return `<circle class="${cls}" style="--i:${i}"
      cx="${sx(r.objectives.irrigation).toFixed(2)}"
      cy="${sy(r.objectives.production).toFixed(2)}" r="${mine?1.8:1.3}"
      data-i="${r.index}" style="cursor:pointer"><title>${esc(r.name)}
output ${fmt(r.objectives.production)} t DM/ha/yr
water ${fmt(r.objectives.irrigation,0)} mm/yr</title></circle>`;
  }).join("");
  host.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="Output against irrigation for every rotation">
      <line class="axis" x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}"/>
      <line class="axis" x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}"/>
      ${pts}
      <text x="${PL}" y="${H-PB+4}">${fmt(xmin,0)}</text>
      <text x="${W-PR}" y="${H-PB+4}" text-anchor="end">${fmt(xmax,0)} mm/yr water →</text>
      <text x="${PL-1.5}" y="${PT+2}" text-anchor="end">${fmt(ymax,1)}</text>
      <text x="${PL-1.5}" y="${H-PB}" text-anchor="end">${fmt(ymin,1)}</text>
      <text x="2.6" y="${H-PB}" transform="rotate(-90 2.6 ${H-PB})">t DM/ha/yr →</text>
    </svg>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>not beaten on every measure</span>
      <span><i style="background:var(--faint)"></i>beaten outright</span>
      <span><i style="background:var(--bad)"></i>your current rotation</span></div>
    <p class="srcnote">Up and to the left is better: more off the field for less
      water. Click a dot to compare it.</p>`;
  host.querySelectorAll("circle").forEach(c =>
    c.onclick = () => pickRotation(Number(c.dataset.i)));
}

/* ─────────────────────────────────────────────────────── calendar */
function calendar(rot){
  if(!rot.schedule || !rot.schedule.length) return "";
  const years = rot.cycle_years, rows = [];
  let n = 0;
  for(let y=0; y<years; y++){
    let segs = "";
    rot.schedule.forEach(sp => {
      for(const off of [0,-1]){
        if(sp.year_offset !== (((y+off)%years)+years)%years) continue;
        const start = sp.start_doy - 1 + (off===-1 ? -365 : 0);
        const a = Math.max(start,0), z = Math.min(start + sp.duration_days, 365);
        if(z <= a) continue;
        const col = GROUP_COLOUR[sp.group] || "#6b7280";
        const width = (z-a)/365*100;
        const mode = sp.irrigation === "ponded" ? " pond"
          : sp.irrigation !== "rainfed" ? " irr" : "";
        segs += `<div class="seg${mode}" style="--s:${n++};left:${(a/365*100).toFixed(2)}%;
          width:${width.toFixed(2)}%;background:${col}"
          title="${esc(sp.crop_name)} · sown day ${sp.start_doy}, ${sp.duration_days} days"
          >${width>13?esc(sp.crop_name.split(" (")[0]):""}</div>`;
      }
    });
    rows.push(`<div style="display:flex;align-items:center">
      <span class="caltag">yr ${y+1}</span>
      <div class="calrow" style="flex:1">${segs}</div></div>`);
  }
  const anyIrr = rot.schedule.some(s=>s.irrigation==="refill_on_stress");
  const anyPond = rot.schedule.some(s=>s.irrigation==="ponded");
  return `<div class="cal">
    <div style="display:flex"><span class="caltag"></span>
      <div class="months" style="flex:1">${MONTHS.map(m=>`<span>${m}</span>`).join("")}</div></div>
    ${rows.join("")}
    <div class="legend">
      ${anyIrr?"<span>diagonal hatch = irrigated</span>":""}
      ${anyPond?"<span>fine hatch = flooded paddy</span>":""}
      <span>gaps = bare ground</span></div></div>`;
}

/* ───────────────────────────────────────────────────────── 3. Compare */
function screenCompare(){
  const b = state.bundle, rank = state.rank;
  const mine = rank.existing;
  const picks = [];
  if(state.selected !== null){
    const fromRank = rank.ranked.find(r=>r.index===state.selected);
    const raw = b.rotations.find(r=>r.index===state.selected);
    if(raw && !raw.is_existing) picks.push(fromRank || toRanked(raw));
  }
  rank.ranked.forEach(r => {
    if(!r.is_existing && picks.length < 2 && !picks.some(p=>p.index===r.index)) picks.push(r);
  });
  const cols = [];
  if(mine) cols.push({r:mine, label:"Your rotation now", cls:"base"});
  picks.forEach((r,i) => cols.push({
    r, label: i===0 ? "Recommended" : "Runner-up", cls: i===0 ? "pick" : ""}));

  const objs = b.objectives, bestOf = {};
  objs.forEach(o => {
    const vals = cols.map(c=>c.r.objectives[o.key]).filter(v=>v!==undefined);
    if(vals.length) bestOf[o.key] = o.maximise ? Math.max(...vals) : Math.min(...vals);
  });

  return `
    <p class="lede">Your current rotation beside the options FieldShift ranks
      highest. Same field, same weather, same soil — the only difference is what
      gets planted and when.</p>
    ${tierBanner(b.region||{validated:true})}

    <div class="cmp stagger">${cols.map(c => {
      const rot = b.rotations.find(x=>x.index===c.r.index);
      return `<div class="col ${c.cls}">
        <div class="ch"><div class="cl">${esc(c.label)}</div>
          <h4>${esc(c.r.name.replace(/^EXISTING: /,""))}</h4></div>
        <div class="cb">
          ${objs.map(o => {
            const v = c.r.objectives[o.key];
            if(v===undefined) return "";
            const m = PLAIN[o.key] || {u:o.units, d:2};
            const shown = o.key==="bare_ground" ? fmt(v*100,0)+"%" : fmt(v, m.d);
            const best = cols.length>1 && Math.abs(v-bestOf[o.key])<1e-9;
            return `<div class="m"><span>${esc(m.k||o.label)}</span>
              <b class="${best?"best":""}">${shown}${o.key==="bare_ground" ? ""
                : ` <small>${esc(m.u||o.units)}</small>`}</b></div>`;
          }).join("")}
          <div class="m"><span>harvests/decade</span>
            <b>${fmt(c.r.detail.crops_per_decade,1)}</b></div>
          ${rot?calendar(rot):""}
        </div></div>`;
    }).join("")}</div>

    ${cols.length>1 ? `<p class="srcnote">Green marks the best value in each row.
      All ${objs.length} measures are shown, because one blended score would hide
      the trade-off that matters.</p>` : ""}

    <div class="row">
      ${state.selected!==null ? `<button class="primary"
        onclick="window.open(api.fieldplan(${state.selected}),'_blank')">
        Print the field plan</button>` : ""}
      <button class="ghost" onclick="go('evidence')">See the evidence</button>
      <button class="ghost" onclick="go('rotations')">Back to all rotations</button>
    </div>`;
}

function toRanked(rot){
  return {index:rot.index, name:rot.name, score:0, is_existing:rot.is_existing,
    on_front:rot.on_front, objectives:rot.objectives, detail:rot.detail};
}

/* ────────────────────────────────────────────────────── 4. Evidence */
function currentIndex(){
  if(state.selected !== null) return state.selected;
  return state.rank && state.rank.ranked.length ? state.rank.ranked[0].index : null;
}

function screenEvidence(){
  const idx = currentIndex();
  if(idx === null) return `<div class="loading">No rotation selected.</div>`;
  const rot = state.bundle.rotations.find(r=>r.index===idx);
  return `
    <p class="lede">An evidence card for every recommendation: the datasets behind
      it, how coarse each one is, what the model cannot see, and who needs to check
      it. <b>Click any card to turn it over.</b></p>
    <div class="sec"><h3>${esc((rot?rot.name:"").replace(/^EXISTING: /,""))}</h3>
      <div class="rule"></div></div>
    <div id="evbody">
      <div class="skel lg"></div><div class="skel"></div><div class="skel sm"></div>
    </div>`;
}

async function loadEvidence(){
  const idx = currentIndex();
  if(idx === null) return;
  const host = () => document.getElementById("evbody");
  try{
    const ev = await get(api.evidence(idx));
    if(!host()) return;
    const c = ev.card, conf = c.confidence;
    const cls = conf==="high"?"good":conf==="medium"?"warn":"bad";
    const limiting = (c.limiting_sources||[]).map(x=>x.name||x);
    const srcFlips = (c.sources||[]).map(s => {
      const ratio = s.mismatch_ratio;
      const scale = (ratio===null||ratio===undefined) ? "field scale"
        : ratio < 1 ? "finer than this field"
        : `${fmt(ratio,0)}× this field's area`;
      const isLim = limiting.includes(s.name);
      return flip(isLim?"partial":"pass", "Data source", s.name, scale,
        `<p>${esc(s.role)}</p>
         <p style="color:var(--muted)">${esc(s.variables)} · ${esc(s.period)}</p>
         ${s.caveat?`<p><b>Caveat.</b> ${esc(s.caveat)}</p>`:""}
         ${isLim?`<p style="color:var(--warn)"><b>This caps the confidence of this
           card.</b> Improving anything else cannot raise it.</p>`:""}`,
        `${esc(s.confidence)} confidence`);
    }).join("");

    host().innerHTML = `
      <div class="card enter">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="pill ${cls}"><span class="dot"></span>${esc(conf)} confidence</span>
          ${limiting.length?`<span style="font-size:13px;color:var(--muted)">capped by
            <b style="color:var(--ink)">${limiting.map(esc).join(", ")}</b></span>`:""}
        </div>
        <p class="srcnote">Confidence is the weakest input, not an average.
          Averaging would let a good dataset launder a bad one.</p>
      </div>

      <div class="sec"><h3>Where the numbers come from</h3><div class="rule"></div></div>
      <div class="flips">${srcFlips}</div>

      ${(c.needs_local_review||[]).length?`
      <details class="disclose" style="margin-top:14px">
        <summary>Needs someone with local knowledge
          <span class="cnt">${c.needs_local_review.length}</span></summary>
        <div class="body ev"><ul>${c.needs_local_review
          .map(u=>`<li>${esc(u)}</li>`).join("")}</ul>
        <p class="srcnote">Each is a question a person in the district can answer,
          and answering them is the fastest route to a better number.</p></div>
      </details>`:""}

      ${(c.unknowns||[]).length?`
      <details class="disclose">
        <summary>What this does not account for
          <span class="cnt">${c.unknowns.length}</span></summary>
        <div class="body ev"><ul>${c.unknowns.map(u=>`<li>${esc(u)}</li>`).join("")}</ul></div>
      </details>`:""}

      <details class="disclose">
        <summary>The whole card as plain text <span class="cnt">prints</span></summary>
        <div class="body"><pre>${esc(ev.rendered)}</pre></div>
      </details>`;
    stagger(host()); wireFlips();
  }catch(e){
    if(host()) host().innerHTML = `<div class="warn">${esc(e.message)}</div>`;
  }
}

/* ────────────────────────────────────────────── 5. Climate stress */
function screenClimate(){
  if(state.source.kind === "job"){
    return `<div class="warn"><b>Climate stress runs on precomputed fields.</b>
      Pick one of the saved fields in the sidebar first.</div>`;
  }
  const j = state.scenarioJob, res = state.scenarioResult;
  const ex = state.rank.existing;
  return `
    <p class="lede">Would the recommendation still hold if every year had been
      hotter and drier? This replays the same forty-one years with a constant
      offset and re-simulates everything — about half a minute.</p>

    <div class="warn">
      <b>A stress test, not a climate projection.</b> We replay the observed
      1984–2024 record with an offset. It answers <i>"would this still work if
      every year had been 2 °C hotter"</i>. It does <b>not</b> answer <i>"what
      will the climate be in 2050"</i>.</div>

    <div class="sec"><h3>Pick a stress test</h3><div class="rule"></div></div>
    <div class="goals">${state.scenarios.filter(sc=>!sc.is_baseline).map(sc =>
      `<button class="goal ${j && j.scenario && j.scenario.name===sc.name?"on":""}"
        ${j && j.status==="running" ? "disabled" : ""}
        onclick="runScenario(${sc.warming_c},${sc.rain_scale},'${esc(sc.name)}')">
        ${esc(sc.name)}</button>`).join("")}</div>

    ${j && j.status==="running" ? `
      <div class="card enter" style="margin-top:18px">
        <h3>Re-simulating under ${esc(j.scenario?j.scenario.name:"")}</h3>
        <div class="prog"><i style="width:${Math.max(j.progress*100,4)}%"></i></div>
        <div style="font-size:13px;color:var(--muted)">
          ${fmt(j.elapsed_seconds,0)}s · ${esc(j.message)}</div>
      </div>` : ""}

    ${j && j.status==="failed" ? `<div class="warn" style="margin-top:16px">
      <b>That run failed.</b> <code>${esc(j.error||"")}</code></div>` : ""}

    ${res ? climateResult(res, ex) : ""}`;
}

function climateResult(res, baselineExisting){
  const sb = res.scenario;
  const ex = res.rotations.find(r => r.is_existing);
  const objs = res.objectives, mx = {};
  objs.forEach(o => mx[o.key] = o.maximise);
  const dominates = (a, e) => {
    let better = false;
    for(const o of objs){
      const av = a.objectives[o.key], ev = e.objectives[o.key];
      if(av === undefined || ev === undefined) continue;
      if(mx[o.key]){ if(av < ev - 1e-9) return false; if(av > ev + 1e-9) better = true; }
      else { if(av > ev + 1e-9) return false; if(av < ev - 1e-9) better = true; }
    }
    return better;
  };
  const dom = ex ? res.rotations.filter(r => !r.is_existing && dominates(r, ex)) : [];
  const best = dom.length
    ? dom.reduce((a,b) => a.objectives.production >= b.objectives.production ? a : b)
    : null;
  const baselineTop = state.rank.ranked[0];
  const held = best && baselineTop &&
    best.name.replace(/^EXISTING: /,"") === baselineTop.name.replace(/^EXISTING: /,"");

  const site = res.site, baseSite = state.bundle.site;
  const rows = [
    ["rainfall", baseSite.rainfall_mm_yr, site.rainfall_mm_yr, "mm/yr", 0, false],
    ["evaporative demand", baseSite.weather.annual_et0_mm,
     site.weather.annual_et0_mm, "mm/yr", 0, false],
  ];
  if(ex && baselineExisting){
    rows.push(["your output", baselineExisting.objectives.production,
      ex.objectives.production, "t DM/ha/yr", 2, true]);
    rows.push(["your water need", baselineExisting.objectives.irrigation,
      ex.objectives.irrigation, "mm/yr", 0, false]);
    rows.push(["your soil carbon", baselineExisting.objectives.carbon,
      ex.objectives.carbon, "t C/ha/yr", 3, true]);
  }

  return `
    <div class="sec"><h3>Under ${esc(sb.name)}</h3><div class="rule"></div></div>
    <div class="${held?"note":"warn"} enter">
      ${held
        ? `<b>The advice holds.</b> Under this climate the same rotation still comes
           out on top, and <b>${dom.length}</b> rotations still beat your current
           one on every measure. A recommendation that survives being stressed is
           worth more than one that only works in the weather we happened to get.`
        : best
          ? `<b>The advice changes.</b> Under this climate the leading option
             becomes <b>${esc(best.name)}</b> — so the current recommendation
             depends on the climate staying roughly as it has been.`
          : `<b>Nothing beats your current rotation outright under this climate.</b>`}
    </div>

    <div class="card"><table>
      <tr><th>what changes</th><th class="n">observed</th>
        <th class="n">stressed</th><th class="n">change</th></tr>
      ${rows.map(([label, a, c, unit, dp, up]) => {
        const diff = c - a;
        const good = up ? diff > 0 : diff < 0;
        const col = Math.abs(diff) < 1e-9 ? "muted" : (good ? "good" : "bad");
        return `<tr><td>${esc(label)}</td>
          <td class="n">${fmt(a,dp)}</td><td class="n">${fmt(c,dp)}</td>
          <td class="n" style="color:var(--${col});font-weight:620">
            ${sign(diff,dp)} ${esc(unit)}</td></tr>`;
      }).join("")}
    </table></div>

    ${best ? `<div class="card hov">
      <h3>Best option under this climate</h3>
      <div class="rot" style="cursor:default;margin:0;box-shadow:none">
        <div class="r1"><span class="nm">${esc(best.name)}</span></div>
        <div class="r2">
          <span class="m-production">output <b>${fmt(best.objectives.production)}</b> t DM/ha/yr</span>
          <span class="m-water">water <b>${fmt(best.objectives.irrigation,0)}</b> mm/yr</span>
          <span class="m-carbon">carbon <b>${sign(best.objectives.carbon,3)}</b></span>
        </div>${calendar(best)}
      </div></div>` : ""}

    <details class="disclose">
      <summary>What this stress test does not represent
        <span class="cnt">${(sb.caveats||[]).length}</span></summary>
      <div class="body ev"><ul>${(sb.caveats||[])
        .map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
    </details>`;
}

async function runScenario(warming, rainScale, label){
  stopScenarioPolling();
  state.scenarioResult = null;
  try{
    const started = await get(`/api/site/${state.siteId}/scenario`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({warming_c:warming, rain_scale:rainScale, label}),
    });
    state.scenarioJob = {job_id:started.job_id, status:"running", progress:0,
      elapsed_seconds:0, message:started.message,
      scenario:{name:label, caveats:[]}};
    render();
    state.scenarioPoll = setInterval(async () => {
      try{
        const j = await get(`/api/analyse/${started.job_id}`);
        state.scenarioJob = j;
        if(j.status === "done"){ stopScenarioPolling(); state.scenarioResult = j.result; }
        if(j.status === "failed") stopScenarioPolling();
        if(state.screen === "climate") render();
      }catch(e){
        stopScenarioPolling();
        state.scenarioJob = {...(state.scenarioJob||{}), status:"failed", error:e.message};
        if(state.screen === "climate") render();
      }
    }, 2500);
  }catch(e){
    state.scenarioJob = {status:"failed", error:e.message};
    render();
  }
}
function stopScenarioPolling(){
  if(state.scenarioPoll){ clearInterval(state.scenarioPoll); state.scenarioPoll = null; }
}

/* ──────────────────────────────────────────────────── 6. Validation */
function screenValidation(){
  const v = state.validation;
  if(!v) return `<div class="warn">No validation record found on disk.</div>`;
  const reg = state.bundle.region || {tier:1, validated:true};
  const checks = v.checks;
  const pass = checks.filter(c=>c.verdict==="pass").length;
  const partial = checks.filter(c=>c.verdict==="partial").length;
  const fail = checks.filter(c=>c.verdict==="fail").length;

  const cards = checks.map(c => flip(
    c.verdict,
    c.verdict==="pass" ? "Passed" : c.verdict==="partial" ? "Partly passed" : "Not validated",
    c.title, c.result,
    `<p><b>${esc(c.question)}</b></p><p>${esc(c.detail)}</p>
     <p style="color:var(--muted)">Checked against ${esc(c.against)}.</p>
     <p>Reproduce: <code>${esc(c.reproduce)}</code></p>`,
    `tier ${c.tier}`)).join("");

  return `
    <p class="lede">Most of the work went here rather than into features. A model
      that has not been checked against observation is a plausible-looking opinion.
      This is the whole record — including what we <b>fail</b>.</p>

    <div class="stats stagger">
      <div class="stat"><div class="k">Checks passed</div>
        <div class="v"><span data-count="${pass}">0</span> of ${checks.length}
        <div class="s">${partial} partial, ${fail} not validated</div></div></div>
      <div class="stat"><div class="k">Errors found in ourselves</div>
        <div class="v"><span data-count="${v.bugs_found.length}">0</span>
        <div class="s">all listed below</div></div></div>
      <div class="stat"><div class="k">This field</div>
        <div class="v">Tier ${reg.tier}
        <div class="s">${reg.validated ? "validated against yields"
          : "transferred, unvalidated"}</div></div></div>
    </div>

    <div class="sec"><h3>Every check we ran</h3><div class="rule"></div></div>
    <p class="srcnote" style="margin:-6px 0 14px">Click any card to turn it over.</p>
    <div class="flips">${cards}</div>

    <details class="disclose" style="margin-top:20px">
      <summary>What validation found wrong in our own model
        <span class="cnt">${v.bugs_found.length}</span></summary>
      <div class="body">
        <p class="srcnote" style="margin-top:0">Each was producing confident,
          plausible output before it was caught. A model whose authors cannot name
          its past errors has probably not looked for them.</p>
        ${v.bugs_found.map(b => `<div class="card raise" style="margin-top:12px">
          <h3>${esc(b.title)}</h3>
          <p style="font-size:13px;color:var(--bad);margin:0 0 8px">
            <b>Effect:</b> ${esc(b.effect)}</p>
          <p style="font-size:13px;color:var(--ink-2);margin:0">${esc(b.how)}</p>
        </div>`).join("")}
      </div>
    </details>

    <div class="sec"><h3>A claim we withdrew</h3><div class="rule"></div></div>
    <div class="warn">
      <b>We once claimed an 18% high bias in our reference ET.</b> It came from a
      half-remembered figure rather than a dataset. When gridMET was actually
      fetched, the real bias was <b>−3.2%</b>. The claim was withdrawn and a rule
      adopted: a validation target must be a dataset we fetched or a citation we
      can point at — never a remembered number. Every figure here has a command
      beside it that reproduces it.</div>`;
}

  const patterns = reg ? reg.patterns : [];

    <p class="lede">Pick any field on Earth, say what you grow there now, and

      <div class="field"><label for="in-lon">Longitude</label>

    <div class="sec"><h3>3 · What do you grow now?</h3><div class="rule"></div></div>

      <div class="help">This is what every alternative gets compared against.

    </div>

    <details class="disclose" style="margin-top:18px">
      <summary>Field size <span class="cnt">optional</span></summary>
