function analysePanel(){
  const j = state.job;
  const stages = [
    ["weather", "Fetching 41 years of NASA POWER weather"],
    ["soil", "Looking up the soil at this point"],
    ["simulate", "Simulating every candidate rotation"],
    ["rank", "Scoring and finding the trade-off front"],
  ];
  const at = stages.map(x=>x[0]).indexOf(j.stage);
  if(j.status === "failed"){
    return `<div class="warn"><b>That analysis failed.</b><br>
      <code style="font-size:12px">${esc(j.error||"unknown error")}</code>
      <br><br>Most common causes: a point in the sea, or ISRIC SoilGrids
      rate-limiting — it answers HTTP 200 with empty values when busy.</div>
      <div class="row"><button class="ghost" onclick="resetAnalysis()">
        Try again</button></div>`;
  }
  if(j.status === "done"){
    return `<div class="note enter"><b>Analysis complete</b> in
      ${fmt(j.elapsed_seconds,0)} seconds. This field now behaves like any other,
      except that nobody has checked its calendar against local practice.</div>
      <div class="row">
        <button class="primary" onclick="go('rotations')">See the rotations</button>
        <button class="ghost" onclick="resetAnalysis()">Analyse another</button>
      </div>`;
  }
  return `
    <div class="card enter">
      <h3>Analysing ${fmt(j.latitude,4)}, ${fmt(j.longitude,4)}</h3>
      <div class="prog"><i style="width:${Math.max(j.progress*100,3)}%"></i></div>
      <div style="font-size:13px;color:var(--muted)">
        ${fmt(j.elapsed_seconds,0)}s elapsed · ${esc(j.message)}</div>
      <div class="stages">${stages.map(([key,label],i) =>
        `<div class="stg ${i<at?"done":i===at?"now":""}">
          <span class="tick">${i<at?"✓":""}</span>${esc(label)}</div>`).join("")}</div>
    </div>
    <div class="row"><button class="ghost" onclick="resetAnalysis()">Cancel</button></div>`;
}

function setPoint(lat, lon){
  if(lat !== null && lat !== "") state.draft.lat = Number(lat);
  if(lon !== null && lon !== "") state.draft.lon = Number(lon);
  updateRegionHint();
  const btn = document.querySelector("button.primary[disabled]");
  if(btn && state.draft.lat!==null && state.draft.lon!==null)
    btn.removeAttribute("disabled");
}
function setRegion(id){ state.draft.region = id; state.draft.rotation = []; render(); }
function addYear(id){ state.draft.rotation.push(id); render(); }
function dropYear(i){ state.draft.rotation.splice(i,1); render(); }
function useExample(){
  state.draft = {lat:30.9010, lon:75.8573, region:"in_punjab",
                 rotation:["rice_wheat"], hectares:3};
  render();
}

function updateRegionHint(){
  const host = document.getElementById("regionhint");
  if(!host || state.draft.lat===null || state.draft.lon===null) return;
  const near = state.sites.map(s => ({s, km: haversine(state.draft.lat,
    state.draft.lon, s.latitude, s.longitude)})).sort((a,b)=>a.km-b.km)[0];
  if(!near) return;
  const far = near.km > 1500;
  host.innerHTML = `<div class="${far?"warn":"note"}" style="margin-top:14px">
    Nearest field we have actually run: <b>${esc(near.s.name)}</b>,
    ${fmt(near.km,0)} km away. ${far
      ? "Far enough that the cropping calendar almost certainly does not apply. "
        + "The physics still does, so treat this as a demonstration."
      : near.km > 300
        ? "The sowing dates are borrowed from that region and should be checked."
        : "The calendar for this region is likely to apply."}</div>`;
}
function haversine(a,b,c,d){
  const R=6371, r=x=>x*Math.PI/180;
  const h = Math.sin(r(c-a)/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

let pickMarker = null;
function mountPicker(){
  const el = document.getElementById("pickmap");
  if(!el || !window.L) return;
  const d = state.draft;
  const map = L.map(el, {scrollWheelZoom:true, worldCopyJump:true})
    .setView(d.lat!==null ? [d.lat,d.lon] : [25,30], d.lat!==null ? 8 : 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:14, attribution:"&copy; OpenStreetMap"}).addTo(map);
  state.sites.forEach(s => {
    L.marker([s.latitude, s.longitude], {icon: L.divIcon({className:"",
      iconSize:[14,14], iconAnchor:[7,7],
      html:`<div class="pinwrap" style="width:14px;height:14px">
        <div class="pin t${s.tier}" style="border-width:2px"></div></div>`})})
      .addTo(map).bindTooltip(esc(s.name), {direction:"top"});
  });
  const place = (lat, lon) => {
    if(pickMarker) map.removeLayer(pickMarker);
    pickMarker = L.marker([lat,lon]).addTo(map);
  };
  if(d.lat!==null && d.lon!==null) place(d.lat, d.lon);
  map.on("click", e => {
    state.draft.lat = Math.round(e.latlng.lat*10000)/10000;
    state.draft.lon = Math.round(e.latlng.lng*10000)/10000;
    place(state.draft.lat, state.draft.lon);
    const la = document.getElementById("in-lat"), lo = document.getElementById("in-lon");
    if(la) la.value = state.draft.lat;
    if(lo) lo.value = state.draft.lon;
    setPoint(null, null);
  });
  setTimeout(()=>map.invalidateSize(), 80);
  updateRegionHint();
}

async function runAnalysis(){
  const d = state.draft;
  if(d.lat === null || d.lon === null) return;
  try{
    const started = await get("/api/analyse", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({latitude:d.lat, longitude:d.lon,
        field_hectares:d.hectares, region:d.region, current_rotation:d.rotation}),
    });
    state.job = {job_id:started.job_id, status:"running", stage:"weather",
      message:started.message, progress:0, elapsed_seconds:0,
      latitude:d.lat, longitude:d.lon};
    render();
    poll(started.job_id);
  }catch(e){
    state.job = {status:"failed", error:e.message, stage:"failed",
      latitude:d.lat, longitude:d.lon, progress:0, elapsed_seconds:0};
    render();
  }
}
function stopPolling(){ if(state.poll){ clearInterval(state.poll); state.poll=null; } }
function poll(jobId){
  stopPolling();
  state.poll = setInterval(async () => {
    try{
      const j = await get(`/api/analyse/${jobId}`);
      state.job = j;
      if(j.status === "done"){
        stopPolling();
        state.bundle = j.result;
        state.source = {kind:"job", id:jobId};
        state.siteId = null; state.selected = null;
        await rerank();
        return;
      }
      if(j.status === "failed") stopPolling();
      if(state.screen === "analyse") render();
    }catch(e){
      stopPolling();
      state.job = {...(state.job||{}), status:"failed", error:e.message};
      if(state.screen === "analyse") render();
    }
  }, 2500);
}
function resetAnalysis(){ stopPolling(); state.job = null; render(); }

/* ──────────────────────────────────────────────────── flip cards */
function flip(kind, tag, title, value, back, meta){
  return `<div class="flip ${esc(kind)}" role="button" tabindex="0"
      aria-label="${esc(title)} — activate for detail"><div class="inner">
    <div class="face front">
      <div class="ft">${esc(tag)}</div><h4>${esc(title)}</h4>
      <div class="fv">${esc(value)}</div>
      <div class="fm"><span>${esc(meta||"")}</span>
        <span class="turn">turn over ↻</span></div>
    </div>
    <div class="face back">
      <div class="ft">${esc(title)}</div><div class="fd">${back}</div>
      <div class="fm"><span>${esc(meta||"")}</span>
        <span class="turn">back ↺</span></div>
    </div></div></div>`;
}
function wireFlips(){
  document.querySelectorAll(".flip").forEach(el => {
    el.onclick = () => el.classList.toggle("on");
    el.onkeydown = e => {
      if(e.key===" " || e.key==="Enter"){ e.preventDefault(); el.classList.toggle("on"); }
    };
  });
}

boot();
</script>
