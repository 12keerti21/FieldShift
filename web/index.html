<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldShift</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ===================================================================== tokens
   Forest / leaf / sage / earth on off-white. Dark mode redefines only the
   tokens, so the toggle wins in both directions. */
:root{
  --forest:#183D32; --leaf:#269B69; --sage:#D9E8CF; --earth:#E8D9B8; --off:#F5F5F0;
  --ink:#16201b; --ink-2:#38463e; --muted:#6a7870; --faint:#94a09a;
  --line:#e0e5dd; --line-2:#eef1ea; --bg:var(--off); --panel:#fff; --raise:#fafbf7;
  --brand:var(--forest); --accent:var(--leaf); --brand-ink:#0d2a22;
  --navbg:#183D32;
  --good:#1a7a46; --good-bg:#e9f5ee;
  --bad:#b03a26; --bad-bg:#fbeceb;
  --warn:#8a5a00; --warn-bg:#fdf6e6;
  --t1:#269B69; --t2:#7a4ba8;
  --shadow:0 1px 2px rgba(24,61,50,.05), 0 4px 16px rgba(24,61,50,.07);
  --r:12px; --r-sm:7px; --nav:234px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7ede8; --ink-2:#c2cdc6; --muted:#94a29a; --faint:#6e7c74;
    --line:#2a332e; --line-2:#222a26; --bg:#101512; --panel:#181e1a; --raise:#1d241f;
    --brand:#2f6b58; --accent:#3fbf86; --brand-ink:#9fe8c7;
    --navbg:#0d1813; --sage:#223029; --earth:#2e2a1e;
    --good:#4cc281; --good-bg:#15291e;
    --bad:#e8745c; --bad-bg:#2b1a17;
    --warn:#d9a441; --warn-bg:#2a2110;
    --t1:#3fbf86; --t2:#b18ad8;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ede8; --ink-2:#c2cdc6; --muted:#94a29a; --faint:#6e7c74;
  --line:#2a332e; --line-2:#222a26; --bg:#101512; --panel:#181e1a; --raise:#1d241f;
  --brand:#2f6b58; --accent:#3fbf86; --brand-ink:#9fe8c7;
  --navbg:#0d1813; --sage:#223029; --earth:#2e2a1e;
  --good:#4cc281; --good-bg:#15291e;
  --bad:#e8745c; --bad-bg:#2b1a17;
  --warn:#d9a441; --warn-bg:#2a2110;
  --t1:#3fbf86; --t2:#b18ad8;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:620;letter-spacing:-.012em}
button{font:inherit}
img{max-width:100%}
[hidden]{display:none!important}

/* ===================================================================== shell */
.app{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}
nav{background:var(--navbg);color:#dfeae4;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px;
  padding-top:calc(18px + env(safe-area-inset-top,0px))}
.mark{width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--leaf),#1d7d53);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand h1{font-size:16.5px;color:#fff}
.brand .tag{font-size:11px;color:#9fc0b1;margin-top:1px}
.navsec{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:#7fa394;
  padding:13px 20px 5px;font-weight:650}
.navlist{padding:2px 10px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#bed4c9;padding:9px 11px;border-radius:var(--r-sm);
  cursor:pointer;font-size:13.2px;transition:background .12s,color .12s}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn.on{background:var(--leaf);color:#fff;font-weight:600}
.navbtn .ni{width:17px;text-align:center;flex-shrink:0;font-size:13px;opacity:.9}
.navbtn .nn{flex:1;min-width:0}
.navbtn .nb{font-size:10px;background:rgba(255,255,255,.17);padding:1px 6px;
  border-radius:999px}
.navbtn.on .nb{background:rgba(0,0,0,.22)}
.fieldsel{padding:2px 10px 6px}
.fs{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);
  border:1px solid transparent;color:#cfe0d7;border-radius:var(--r-sm);
  padding:7px 10px;cursor:pointer;font-size:12.3px;margin-bottom:3px;line-height:1.35}
.fs:hover{background:rgba(255,255,255,.1)}
.fs.on{background:rgba(38,155,105,.24);border-color:var(--leaf);color:#fff}
.fs .fn{font-weight:600;display:block}
.fs .ft{font-size:10.5px;color:#8fb3a3}
.fs.on .ft{color:#b9e2cf}
.navfoot{margin-top:auto;padding:14px 18px;font-size:11px;color:#89aa9c;
  border-top:1px solid rgba(255,255,255,.09);line-height:1.5;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.navfoot button{background:none;border:1px solid rgba(255,255,255,.22);color:#bed4c9;
  border-radius:var(--r-sm);padding:5px 10px;font-size:11.5px;cursor:pointer;
  margin-top:9px}
.navfoot button:hover{border-color:var(--leaf);color:#fff}

.stage{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:500;background:var(--panel);
  border-bottom:1px solid var(--line);padding:11px 24px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap;
  padding-top:calc(11px + env(safe-area-inset-top,0px))}
.bar h2{font-size:16px}
.bar .sub{color:var(--muted);font-size:12.5px}
.bar .sp{margin-left:auto}
.screen{padding:22px 24px 60px;max-width:1180px;width:100%}

/* ===================================================================== bits */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;
  text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;
  background:var(--line-2);color:var(--muted);white-space:nowrap}
.pill.t1{background:var(--sage);color:var(--brand)}
.pill.t2{background:color-mix(in srgb,var(--t2) 16%,transparent);color:var(--t2)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:16px 17px;margin-bottom:12px}
.card.raise{background:var(--raise)}
.card h3{font-size:14.5px;margin-bottom:9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}

.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec:first-child{margin-top:0}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  font-weight:650;white-space:nowrap}
.sec .rule{flex:1;height:1px;background:var(--line)}
.lede{color:var(--ink-2);font-size:13.4px;max-width:72ch;margin:0 0 16px}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:12px}
.facts .f{background:var(--panel);padding:11px 13px}
.facts .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--faint);font-weight:620}
.facts .v{font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
.facts .v small{color:var(--muted);font-size:11.5px;font-weight:400;display:block;
  margin-top:1px}

.finding{border-left:3px solid var(--accent);background:var(--raise);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:12px 14px;margin:12px 0;
  font-size:13.2px}
.finding b{color:var(--brand-ink)}
.alert{border-left:3px solid var(--warn);background:var(--warn-bg);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:12px 14px;margin:12px 0;
  font-size:12.9px}
.alert b{color:var(--warn)}

/* ================================================================ the answer */
.answer{border:1px solid var(--accent);border-radius:var(--r);overflow:hidden;
  margin-bottom:14px;box-shadow:var(--shadow)}
.answer .ah{background:var(--brand);color:#fff;padding:8px 16px;font-size:10.5px;
  font-weight:650;text-transform:uppercase;letter-spacing:.09em}
.answer .ab{padding:15px 16px;background:var(--panel)}
.answer .big{font-size:18px;font-weight:650;line-height:1.35;margin-bottom:9px}
.answer .plain{font-size:13.4px;color:var(--ink-2);line-height:1.6}
.answer .plain b{color:var(--brand-ink);font-weight:650}
.wins{display:flex;gap:20px;flex-wrap:wrap;margin-top:13px;padding-top:13px;
  border-top:1px solid var(--line-2)}
.win{min-width:84px}
.win .wv{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.win .wv.up{color:var(--good)} .win .wv.down{color:var(--bad)}
.win .wk{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}

/* ================================================================== goals */
.goals{display:flex;gap:8px;flex-wrap:wrap}
.goal{font-size:12.8px;padding:9px 13px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:all .12s}
.goal:hover{border-color:var(--accent);color:var(--accent)}
.goal.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.goal .ico{font-size:14px;line-height:1}
.goalhint{font-size:12px;color:var(--muted);margin:10px 0 0}
details.tune{margin-top:12px}
details.tune summary{cursor:pointer;font-size:12.5px;color:var(--accent);padding:6px 0;
  user-select:none;font-weight:550}
.pri{margin:12px 0}
.pri .top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.pri .lbl{font-size:13px;font-weight:550}
.pri .dir{font-size:11px;color:var(--faint)}
.pri .num{margin-left:auto;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.pri .hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:20px}

/* =============================================================== rotations */
.rot{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  margin-bottom:9px;cursor:pointer;background:var(--panel);
  transition:border-color .12s,box-shadow .12s}
.rot:hover{border-color:var(--accent)}
.rot.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.rot.mine{background:var(--raise)}
.rot .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rot .rank{font-size:11.5px;font-weight:700;color:var(--faint);
  font-variant-numeric:tabular-nums;min-width:18px}
.rot .nm{font-weight:620;font-size:13.8px;flex:1;min-width:140px}
.rot .sc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rot .r2{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:11.8px;
  color:var(--muted)}
.rot .r2 b{color:var(--ink);font-weight:620;font-variant-numeric:tabular-nums}

/* calendar strip */
.cal{margin-top:10px}
.cal .months{display:flex;font-size:9px;color:var(--faint);margin-bottom:3px}
.cal .months span{flex:1;text-align:center}
.calrow{position:relative;height:17px;background:var(--line-2);border-radius:3px;
  margin-bottom:3px;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;border-radius:3px;font-size:9.5px;color:#fff;
  display:flex;align-items:center;padding:0 4px;overflow:hidden;white-space:nowrap;
  font-weight:600}
.seg.irr::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 2px,transparent 2px 5px)}
.seg.pond::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 4px)}
.caltag{font-size:10px;color:var(--faint);min-width:30px;display:inline-block}
.callegend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.8px;color:var(--muted);
  margin-top:6px}
.callegend i{width:10px;height:10px;border-radius:2px;display:inline-block;
  margin-right:4px;vertical-align:-1px}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--muted)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--faint);opacity:.5}
.chart .pt.front{fill:var(--accent);opacity:.95}
.chart .pt.sel{fill:var(--accent);stroke:var(--ink);stroke-width:1.6;opacity:1}
.chart .pt.mine{fill:var(--bad);stroke:var(--panel);stroke-width:1.4;opacity:1}

table{width:100%;border-collapse:collapse;font-size:12.6px}
td,th{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:0}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
  font-weight:620}
td.n{font-variant-numeric:tabular-nums;text-align:right}

/* ============================================================== flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:13px}
.flip{perspective:1400px;min-height:224px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;min-height:224px;
  transition:transform .55s cubic-bezier(.4,.1,.3,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;border:1px solid var(--line);
  border-radius:var(--r);padding:15px;background:var(--panel);display:flex;
  flex-direction:column;overflow:hidden}
.flip .back{transform:rotateY(180deg);background:var(--raise)}
.flip .ft{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--faint);font-weight:650;margin-bottom:7px}
.flip h4{font-size:14px;margin-bottom:7px;line-height:1.35}
.flip .fv{font-size:15px;font-weight:620;line-height:1.35;margin:2px 0 7px;
  color:var(--brand-ink)}
.flip .fd{font-size:12.3px;color:var(--ink-2);line-height:1.5;overflow-y:auto;flex:1}
.flip .fd p{margin:0 0 7px}
.flip .fm{margin-top:9px;font-size:10.8px;color:var(--faint);display:flex;
  align-items:center;gap:6px}
.flip .fm .turn{margin-left:auto;color:var(--accent);font-weight:600}
.flip code{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--line-2);padding:2px 5px;border-radius:4px;color:var(--ink-2);
  word-break:break-all}
.flip.pass .face{border-top:3px solid var(--good)}
.flip.partial .face{border-top:3px solid var(--warn)}
.flip.fail .face{border-top:3px solid var(--bad)}

.ev ul{margin:6px 0 13px;padding-left:18px;color:var(--ink-2);font-size:12.7px}
.ev li{margin-bottom:5px}
details.raw summary{cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0;
  user-select:none}
details.raw summary:hover{color:var(--accent)}
pre{white-space:pre-wrap;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--raise);border:1px solid var(--line);padding:13px;max-height:420px;
  overflow:auto;border-radius:var(--r-sm);color:var(--ink-2)}

/* ================================================================= compare */
.cmp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.cmp .col{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  overflow:hidden;display:flex;flex-direction:column}
.cmp .col.base{border-color:var(--bad)}
.cmp .col.pick{border-color:var(--accent);box-shadow:var(--shadow)}
.cmp .ch{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--raise)}
.cmp .ch .cl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  font-weight:650;color:var(--faint);margin-bottom:4px}
.cmp .ch h4{font-size:13.5px;line-height:1.35}
.cmp .cb{padding:12px 13px;flex:1}
.cmp .m{display:flex;justify-content:space-between;gap:8px;font-size:12.3px;
  padding:5px 0;border-bottom:1px solid var(--line-2)}
.cmp .m:last-child{border-bottom:0}
.cmp .m span{color:var(--muted)}
.cmp .m b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp .m b.best{color:var(--good)}
.cmp .m b small{color:var(--faint);font-weight:400}

/* ===================================================================== map */
#map{height:min(56vh,540px);min-height:310px;border-radius:var(--r);
  border:1px solid var(--line);overflow:hidden;position:relative;z-index:1}
.maplegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.8px;color:var(--muted);
  margin-top:9px}
.maplegend i.mk{width:12px;height:12px;border-radius:50%;display:inline-block;
  margin-right:5px;vertical-align:-2px;border:2px solid var(--panel);
  box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.pinwrap{position:relative;width:20px;height:20px}
.pin{position:absolute;inset:0;border-radius:50%;border:2.5px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.35)}
.pin.t1{background:#269B69} .pin.t2{background:#7a4ba8}
.pin.on{box-shadow:0 0 0 5px rgba(38,155,105,.3),0 1px 5px rgba(0,0,0,.35)}
.pin.t2.on{box-shadow:0 0 0 5px rgba(122,75,168,.3),0 1px 5px rgba(0,0,0,.35)}
.leaflet-container{background:var(--bg);font:inherit}

.row{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
button.primary{font-size:13px;font-weight:550;padding:9px 15px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:var(--r-sm);cursor:pointer}
button.primary:hover{filter:brightness(1.08)}
button.ghost{font-size:13px;padding:9px 15px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);border-radius:var(--r-sm);cursor:pointer}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
.skel{color:var(--muted);font-size:13px;padding:18px 0}
.srcnote{font-size:11.8px;color:var(--muted);margin-top:8px;line-height:1.5}

.navtoggle{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav);z-index:1000;
    transform:translateX(-100%);transition:transform .22s}
  nav.open{transform:none}
  .navtoggle{display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:var(--r-sm);cursor:pointer;font-size:15px}
  .screen{padding:18px 16px 50px}
  .bar{padding:11px 16px;padding-top:calc(11px + env(safe-area-inset-top,0px))}
}
@media (max-width:480px){
  .bar h2{font-size:14.5px}
  .bar .sub{display:none}
  .answer .big{font-size:16px}
}
</style>
</head>
<body>
<div class="app">

<nav id="nav">
  <div class="brand">
    <div class="mark">F</div>
    <div>
      <h1>FieldShift</h1>
      <div class="tag">Rethink What Grows Next</div>
    </div>
  </div>
  <div class="navsec">Field</div>
  <div class="fieldsel" id="fieldsel"></div>
  <div class="navsec">Analysis</div>
  <div class="navlist" id="navlist"></div>
  <div class="navfoot">
    FieldShift supports a decision; it does not make one.
    <button id="theme">Switch theme</button>
  </div>
</nav>

<div class="stage">
  <div class="bar">
    <button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button>
    <div>
      <h2 id="bar-title">Field</h2>
      <div class="sub" id="bar-sub"></div>
    </div>
    <span class="sp"></span>
    <span id="bar-pill"></span>
  </div>
  <div id="screens"><div class="screen"><div class="skel">Loading fields&hellip;</div></div></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

const KEYS = ["production","downside","irrigation","carbon","wind_exposure","bare_ground"];
const SCREENS = [
  {id:"field",      icon:"◉", name:"Field"},
  {id:"rotations",  icon:"⌘", name:"Rotations"},
  {id:"compare",    icon:"⇄", name:"Compare"},
  {id:"evidence",   icon:"▤", name:"Evidence"},
  {id:"validation", icon:"✓", name:"Validation"},
];
const state = {
  sites:[], siteId:null, bundle:null, rank:null, selected:null,
  screen:"field", weights:{}, goal:"balanced", validation:null,
};

const $ = s => document.querySelector(s);
const fmt = (v,d=2) => (v===null||v===undefined||Number.isNaN(Number(v)))
  ? "–" : Number(v).toFixed(d);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sign = (v,d) => (v>0?"+":"") + fmt(v, d===undefined ? (Math.abs(v)<1?3:2) : d);

/* Six abstract weights are how an engineer thinks about this, not how a farmer
   does. These are the common intents in plain words; the sliders stay underneath
   for anyone who wants them. */
const PRESETS = [
  {id:"balanced", icon:"⚖", label:"Balanced",
   hint:"Weigh everything equally — a good place to start.",
   w:{production:3,downside:3,irrigation:3,carbon:3,wind_exposure:3,bare_ground:3}},
  {id:"water", icon:"☔", label:"Save water",
   hint:"Cut irrigation hard, and accept giving up some output to do it.",
   w:{production:1,downside:2,irrigation:5,carbon:2,wind_exposure:1,bare_ground:2}},
  {id:"yield", icon:"❀", label:"Most output",
   hint:"Maximise what comes off the field, water allowing.",
   w:{production:5,downside:3,irrigation:1,carbon:1,wind_exposure:1,bare_ground:1}},
  {id:"soil", icon:"☘", label:"Build soil",
   hint:"Favour soil carbon, ground cover and protection from erosion.",
   w:{production:2,downside:2,irrigation:2,carbon:5,wind_exposure:4,bare_ground:5}},
  {id:"safe", icon:"⛨", label:"Lowest risk",
   hint:"Protect the bad year rather than the average year.",
   w:{production:2,downside:5,irrigation:3,carbon:2,wind_exposure:2,bare_ground:2}},
];
Object.assign(state.weights, PRESETS[0].w);

const PLAIN = {
  production:{k:"output",u:"t DM/ha/yr",up:true,d:2},
  downside:{k:"bad year",u:"t DM/ha/yr",up:true,d:2},
  irrigation:{k:"water",u:"mm/yr",up:false,d:0},
  carbon:{k:"soil carbon",u:"t C/ha/yr",up:true,d:3},
  wind_exposure:{k:"wind risk",u:"index",up:false,d:0},
  bare_ground:{k:"bare soil",u:"%",up:false,d:0},
};
const GROUP_COLOUR = {
  cereal:"#2f6fb5", grain_legume:"#269B69", oilseed:"#b8860b", fibre:"#8f6b9e",
  root_tuber:"#b5651d", green_manure:"#3f8f4f", cover_crop:"#6aa84f",
  forage:"#4a9c8c", fallow:"#9aa5b1",
};
const MONTHS = ["J","F","M","A","M","J","J","A","S","O","N","D"];

/* -------------------------------------------------------------- chrome */
(function(){
  let saved=null; try{ saved=localStorage.getItem("fs-theme"); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  $("#theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur==="dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("fs-theme", next); }catch(e){}
  };
  $("#navtoggle").onclick = () => $("#nav").classList.toggle("open");
})();

async function get(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok){
    const b = await r.json().catch(()=>({detail:r.statusText}));
    throw new Error(b.detail || r.statusText);
  }
  return r.json();
}

/* ---------------------------------------------------------------- nav */
function renderNav(){
  $("#navlist").innerHTML = SCREENS.map(s => {
    const badge = s.id==="rotations" && state.bundle
      ? `<span class="nb">${state.bundle.search.feasible}</span>` : "";
    return `<button class="navbtn ${s.id===state.screen?"on":""}"
      onclick="go('${s.id}')"><span class="ni">${s.icon}</span>
      <span class="nn">${esc(s.name)}</span>${badge}</button>`;
  }).join("");
  $("#fieldsel").innerHTML = state.sites.map(s => {
    const bits = s.name.split(",");
    return `<button class="fs ${s.id===state.siteId?"on":""}"
      onclick="selectSite('${s.id}')">
      <span class="fn">${esc(bits[0])}</span>
      <span class="ft">Tier ${s.tier}${bits[1]?" · "+esc(bits.slice(1).join(",").trim()):""}</span>
    </button>`;
  }).join("");
}

function go(id){
  state.screen = id;
  $("#nav").classList.remove("open");
  renderNav();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

async function boot(){
  try{
    const [sites, val] = await Promise.all([
      get("/api/sites"), get("/api/validation").catch(()=>null),
    ]);
    state.sites = sites.sites;
    state.validation = val;
    if(!state.sites.length) throw new Error("no bundles on disk");
    renderNav();
    await selectSite(state.sites[0].id);
  }catch(e){
    $("#screens").innerHTML = `<div class="screen"><div class="alert">
      <b>No precomputed fields.</b> ${esc(e.message)}<br><br>
      Build one with <code>python -m fieldshift.api.bundle</code>.</div></div>`;
  }
}

async function selectSite(id){
  state.siteId = id; state.selected = null;
  state.bundle = await get("/api/site/" + id);
  renderNav();
  await rerank();
}

async function rerank(){
  state.rank = await get("/api/rank", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({site_id:state.siteId, priorities:state.weights, limit:8}),
  });
  render();
}

function setGoal(id){
  const p = PRESETS.find(x=>x.id===id);
  if(!p) return;
  state.goal = id;
  Object.assign(state.weights, p.w);
  rerank();
}

let debounce;
function setWeight(k,v){
  state.goal = null;
  state.weights[k] = Number(v);
  const words = ["ignore","low","","","","top"];
  const el = $("#v-"+k);
  if(el) el.textContent = v + (words[v] ? " · " + words[v] : "");
  clearTimeout(debounce);
  debounce = setTimeout(rerank, 130);
}

/* ------------------------------------------------------------- render */
function render(){
  const b = state.bundle, s = b.site, reg = b.region || {tier:1, validated:true};
  const sc = SCREENS.find(x=>x.id===state.screen);
  $("#bar-title").textContent = sc ? sc.name : "Field";
  $("#bar-sub").textContent = s.name;
  $("#bar-pill").innerHTML = `<span class="pill t${reg.tier}"><span class="dot"></span>
    Tier ${reg.tier} · ${reg.validated?"validated":"transferred"}</span>`;
  const fn = {field:screenField, rotations:screenRotations, compare:screenCompare,
              evidence:screenEvidence, validation:screenValidation}[state.screen];
  $("#screens").innerHTML = `<div class="screen">${fn()}</div>`;
  if(state.screen === "field") mountMap();
  if(state.screen === "rotations") mountScatter();
  if(state.screen === "evidence") loadEvidence();
  wireFlips();
}

function tierBanner(reg){
  if(reg.validated) return "";
  return `<div class="alert">
    <b>Tier 2 — transferred, not validated.</b> ${esc(reg.note||"")}
    This is the same engine as the validated US fields, running on global inputs
    only: a predicted soil instead of a survey, and no observed yield series to
    check against. Read what follows as a hypothesis to test locally, not as a
    prediction. The <b>Validation</b> screen says exactly what is missing.</div>`;
}

/* --------------------------------------------------------- 1. Field */
function screenField(){
  const b = state.bundle, s = b.site, reg = b.region || {tier:1,validated:true};
  const ratio = s.rainfall_mm_yr > 0 ? s.weather.annual_et0_mm / s.rainfall_mm_yr : null;
  return `
    <p class="lede">${esc(s.note)}</p>
    ${tierBanner(reg)}
    ${headline()}
    <div class="sec"><h3>This field</h3><div class="rule"></div></div>
    <div class="facts">
      <div class="f"><div class="k">Soil</div><div class="v">${esc(s.soil.texture)}
        <small>${esc(s.soil.component||"")}</small></div></div>
      <div class="f"><div class="k">Water the soil can hold</div>
        <div class="v">${fmt(s.soil.available_water_mm_per_m,0)} mm/m
        <small>${s.soil.provenance==="survey" ? "measured in a soil survey"
          : s.soil.provenance==="prediction" ? "predicted by a global model"
          : "texture-class estimate"}</small></div></div>
      <div class="f"><div class="k">Rainfall</div>
        <div class="v">${fmt(s.rainfall_mm_yr,0)} mm/yr
        <small>average over the record</small></div></div>
      <div class="f"><div class="k">Evaporative demand</div>
        <div class="v">${fmt(s.weather.annual_et0_mm,0)} mm/yr
        <small>reference ET, ${esc(s.weather.et0_confidence)} confidence</small></div></div>
      <div class="f"><div class="k">Weather record</div>
        <div class="v">${s.weather.years} years
        <small>${s.weather.first_year}–${s.weather.last_year}, gap-free</small></div></div>
      <div class="f"><div class="k">Slope</div>
        <div class="v">${s.terrain.slope_percent===null?"–"
          :fmt(s.terrain.slope_percent,2)+"%"}
        <small>${s.terrain.slope_percent===null?"no DEM tile here"
          :"planar fit, NASADEM"}</small></div></div>
    </div>
    ${ratio ? `<div class="finding">Rainfall is
      <b>${fmt(s.rainfall_mm_yr,0)} mm</b> against an evaporative demand of
      <b>${fmt(s.weather.annual_et0_mm,0)} mm</b>. ${ratio > 2
        ? `The atmosphere wants about <b>${fmt(ratio,1)} times</b> more water than the
           sky delivers, so every rotation here is really a decision about water.`
        : `Water is less often the binding constraint here than at the drier fields.`}
      </div>` : ""}

    <div class="sec"><h3>Where these fields are</h3><div class="rule"></div></div>
    <div id="map"></div>
    <div class="maplegend">
      <span><i class="mk" style="background:#269B69"></i>Tier 1 — validated
        against observed yields</span>
      <span><i class="mk" style="background:#7a4ba8"></i>Tier 2 — same engine,
        global inputs, unvalidated</span>
    </div>
    <p class="srcnote">Click a marker to switch field. Weather from NASA POWER;
      soil from ${esc(s.soil.source||"")}.</p>`;
}

function mountMap(){
  const el = document.getElementById("map");
  if(!el || !window.L) return;
  const map = L.map(el, {scrollWheelZoom:true, worldCopyJump:true}).setView([25,30],2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:14, attribution:"&copy; OpenStreetMap"}).addTo(map);
  const pts = [];
  state.sites.forEach(s => {
    const icon = L.divIcon({className:"", iconSize:[20,20], iconAnchor:[10,10],
      html:`<div class="pinwrap"><div class="pin t${s.tier}${s.id===state.siteId?" on":""}"></div></div>`});
    L.marker([s.latitude, s.longitude], {icon}).addTo(map)
      .bindTooltip(`<b>${esc(s.name)}</b><br>Tier ${s.tier} · ${esc(s.region_name||"")}`,
        {direction:"top", offset:[0,-8]})
      .on("click", () => selectSite(s.id));
    pts.push([s.latitude, s.longitude]);
  });
  if(pts.length) map.fitBounds(pts, {padding:[50,50], maxZoom:5});
  setTimeout(()=>map.invalidateSize(), 60);
}

/* ------------------------------------------------------- the answer */
function headline(){
  const rank = state.rank;
  if(!rank || !rank.ranked.length) return "";
  const top = rank.ranked[0], mine = rank.existing;
  const name = esc(top.name.replace(/^EXISTING: /,""));
  if(top.is_existing){
    return `<div class="answer"><div class="ah">The answer for this field</div>
      <div class="ab"><div class="big">Keep what you are doing.</div>
      <div class="plain">On the priorities you have set, <b>${name}</b> is already the
      best of the ${state.bundle.search.feasible} workable rotations simulated through
      ${state.bundle.site.weather.years} years of weather here.</div></div></div>`;
  }
  let cells = "", parts = [];
  if(mine){
    ["irrigation","production","carbon","bare_ground"].forEach(k => {
      const m = PLAIN[k], a = top.objectives[k], e = mine.objectives[k];
      if(a===undefined || e===undefined) return;
      const diff = a - e;
      if(Math.abs(diff) < 1e-9) return;
      const better = m.up ? diff > 0 : diff < 0;
      const scale = k==="bare_ground" ? 100 : 1;
      const pct = Math.abs(e) > 1e-9 ? Math.abs(diff/e)*100 : null;
      cells += `<div class="win"><div class="wv ${better?"up":"down"}">
        ${sign(diff*scale, m.d)}</div><div class="wk">${m.k}<br>${esc(m.u)}</div></div>`;
      if(k==="irrigation" && better)
        parts.push(`<b>${fmt(Math.abs(diff),0)} mm/yr less irrigation water</b>` +
          (pct ? ` — about ${fmt(pct,0)}% of what this field uses now` : ""));
      if(k==="production" && pct !== null)
        parts.push(better ? `<b>${fmt(pct,0)}% more</b> coming off the field`
                          : `${fmt(pct,0)}% less coming off the field`);
      if(k==="carbon" && better) parts.push("soil carbon moving upward instead of down");
    });
  }
  return `<div class="answer"><div class="ah">The answer for this field</div>
    <div class="ab">
      <div class="big">Try ${name}.</div>
      <div class="plain">${parts.length ? "It would mean " + parts.join(", ") + "." : ""}
      ${rank.beaten_by.length
        ? ` Nothing is given up to get there — this beats your current rotation on
            <b>every</b> measure, not just on balance.`
        : ` This is the best fit to the priorities you set, but it does involve a real
            trade-off, so check the comparison before acting.`}</div>
      ${cells ? `<div class="wins">${cells}</div>` : ""}
    </div></div>`;
}

/* ----------------------------------------------------- 2. Rotations */
function screenRotations(){
  const b = state.bundle, rank = state.rank;
  const cur = PRESETS.find(p=>p.id===state.goal);
  const by = {}; b.objectives.forEach(o => by[o.key]=o);
  const sliders = KEYS.filter(k=>by[k]).map(k => {
    const o = by[k], w = state.weights[k], words=["ignore","low","","","","top"];
    return `<div class="pri"><div class="top">
      <span class="lbl">${esc(o.label)}</span>
      <span class="dir">${o.maximise?"more is better":"less is better"}</span>
      <span class="num" id="v-${k}">${w}${words[w]?" · "+words[w]:""}</span></div>
      <input type="range" id="w-${k}" min="0" max="5" step="1" value="${w}"
        aria-label="${esc(o.label)} priority" oninput="setWeight('${k}',this.value)">
      <div class="hint">${esc(o.note)}</div></div>`;
  }).join("");
  const sens = rank.sensitivity.all_stable
    ? `<span class="pill good"><span class="dot"></span>stable</span>
       The leading choice holds even if you move any one priority by half.`
    : `<span class="pill warn"><span class="dot"></span>sensitive</span>
       The leading choice <b>changes</b> if you shift
       ${rank.sensitivity.deciding_priorities.map(esc).join(", ")} — so your own
       weighting is deciding this, not a clear winner.`;
  return `
    <p class="lede">Every rotation below was simulated day by day through
      ${b.site.weather.years} years of real weather at this field. Tell FieldShift what
      you care about and the ranking changes instantly — the physics is already
      done, so only your priorities are being re-applied.</p>

    <div class="sec"><h3>What matters to you</h3><div class="rule"></div></div>
    <div class="card">
      <div class="goals">${PRESETS.map(p =>
        `<button class="goal ${p.id===state.goal?"on":""}" onclick="setGoal('${p.id}')">
          <span class="ico">${p.icon}</span>${esc(p.label)}</button>`).join("")}</div>
      <div class="goalhint">${cur ? esc(cur.hint)
        : "Custom weighting — set from the sliders below."}</div>
      <details class="tune"${cur?"":" open"}>
        <summary>Fine-tune the six measures</summary>${sliders}</details>
    </div>
    <div class="finding" style="border-left-color:var(--line)">${sens}</div>

    ${headline()}

    <div class="sec"><h3>The trade-off space</h3><div class="rule"></div></div>
    <div class="card raise" id="scatter"></div>

    <div class="sec"><h3>Rotations, best first</h3><div class="rule"></div></div>
    ${rank.ranked.map((r,i)=>rotCard(r,i+1)).join("")}
    ${rank.existing && !rank.ranked.some(r=>r.is_existing) ? rotCard(rank.existing,null) : ""}

    <div class="sec"><h3>How these options were found</h3><div class="rule"></div></div>
    <div class="card"><table>
      <tr><td>rotation cycles examined</td><td class="n">${b.search.examined}</td></tr>
      <tr><td>physically feasible here</td><td class="n">${b.search.feasible}</td></tr>
      <tr><td>simulated through ${b.site.weather.years} years of weather</td>
        <td class="n">${b.search.simulated}</td></tr>
      <tr><td>not beaten on every measure</td><td class="n">${b.search.on_front}</td></tr>
    </table></div>
    ${Object.keys(b.search.rejections||{}).length ? `<div class="card">
      <h3>Why the rest were ruled out</h3><table>
      ${Object.entries(b.search.rejections).map(([k,v])=>
        `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("")}</table>
      <p class="srcnote">Nothing is discarded silently. Every rejection carries a
        reason a person can disagree with.</p></div>` : ""}`;
}

function rotCard(r, rank){
  const o = r.objectives;
  const rot = state.bundle.rotations.find(x=>x.index===r.index);
  return `<div class="rot ${r.is_existing?"mine":""} ${state.selected===r.index?"sel":""}"
    data-i="${r.index}" onclick="pickRotation(${r.index})">
    <div class="r1">
      <span class="rank">${rank||""}</span>
      <span class="nm">${esc(r.name.replace(/^EXISTING: /,""))}</span>
      ${r.is_existing?'<span class="pill bad">your rotation</span>':""}
      ${r.on_front?'<span class="pill good">not beaten</span>':""}
      <span class="sc">${fmt(r.score,3)}</span></div>
    <div class="r2">
      <span>output <b>${fmt(o.production)}</b> t DM/ha/yr</span>
      <span>water <b>${fmt(o.irrigation,0)}</b> mm/yr</span>
      <span>carbon <b>${sign(o.carbon,3)}</b> t C/ha/yr</span>
      <span>bare soil <b>${fmt(o.bare_ground*100,0)}%</b></span>
      <span>harvests/decade <b>${fmt(r.detail.crops_per_decade,1)}</b></span></div>
    ${rot?calendar(rot):""}</div>`;
}

function pickRotation(i){ state.selected = i; go("compare"); }

function mountScatter(){
  const host = document.getElementById("scatter");
  if(!host) return;
  const b = state.bundle;
  const xs = b.rotations.map(r=>r.objectives.irrigation);
  const ys = b.rotations.map(r=>r.objectives.production);
  const W=100,H=56,PL=15,PR=3,PT=4,PB=12;
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const ymin=Math.min(...ys), ymax=Math.max(...ys);
  const sx=v=>PL+(xmax===xmin?(W-PL-PR)/2:(v-xmin)/(xmax-xmin)*(W-PL-PR));
  const sy=v=>H-PB-(ymax===ymin?(H-PT-PB)/2:(v-ymin)/(ymax-ymin)*(H-PT-PB));
  const pts = b.rotations.map(r=>{
    const mine=r.is_existing;
    const cls = mine?"pt mine"
      :(state.selected===r.index?"pt sel":(r.on_front?"pt front":"pt"));
    return `<circle class="${cls}" cx="${sx(r.objectives.irrigation).toFixed(2)}"
      cy="${sy(r.objectives.production).toFixed(2)}" r="${mine?1.8:1.3}"
      data-i="${r.index}" style="cursor:pointer"><title>${esc(r.name)}
output ${fmt(r.objectives.production)} t DM/ha/yr
water ${fmt(r.objectives.irrigation,0)} mm/yr</title></circle>`;
  }).join("");
  host.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="Output against irrigation for every simulated rotation">
      <line class="axis" x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}"/>
      <line class="axis" x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}"/>
      ${pts}
      <text x="${PL}" y="${H-PB+7.5}">${fmt(xmin,0)}</text>
      <text x="${W-PR}" y="${H-PB+7.5}" text-anchor="end">${fmt(xmax,0)} mm/yr water →</text>
      <text x="${PL-2}" y="${PT+3}" text-anchor="end">${fmt(ymax,1)}</text>
      <text x="${PL-2}" y="${H-PB}" text-anchor="end">${fmt(ymin,1)}</text>
      <text x="3" y="${PT+3}" transform="rotate(-90 3 ${PT+3})">t DM/ha/yr →</text>
    </svg>
    <div class="callegend">
      <span><i style="background:var(--accent)"></i>not beaten on every measure</span>
      <span><i style="background:var(--faint)"></i>beaten outright</span>
      <span><i style="background:var(--bad)"></i>your current rotation</span></div>
    <p class="srcnote">Up and to the left is better: more off the field for less water.
      Each dot is one simulated rotation — click to compare it.</p>`;
  host.querySelectorAll("circle").forEach(c =>
    c.onclick = () => pickRotation(Number(c.dataset.i)));
}

/* ------------------------------------------------------- calendar */
function calendar(rot){
  if(!rot.schedule || !rot.schedule.length) return "";
  const years = rot.cycle_years, rows = [];
  for(let y=0; y<years; y++){
    let segs = "";
    rot.schedule.forEach(sp => {
      for(const off of [0,-1]){
        if(sp.year_offset !== (((y+off)%years)+years)%years) continue;
        const start = sp.start_doy - 1 + (off===-1 ? -365 : 0);
        const a = Math.max(start,0), z = Math.min(start + sp.duration_days, 365);
        if(z <= a) continue;
        const col = GROUP_COLOUR[sp.group] || "#6b7280";
        const width = (z-a)/365*100;
        const mode = sp.irrigation === "ponded" ? " pond"
          : sp.irrigation !== "rainfed" ? " irr" : "";
        segs += `<div class="seg${mode}" style="left:${(a/365*100).toFixed(2)}%;
          width:${width.toFixed(2)}%;background:${col}"
          title="${esc(sp.crop_name)} · sown day ${sp.start_doy}, ${sp.duration_days} days · ${esc(sp.irrigation)}"
          >${width>13?esc(sp.crop_name.split(" (")[0]):""}</div>`;
      }
    });
    rows.push(`<div style="display:flex;align-items:center">
      <span class="caltag">yr ${y+1}</span>
      <div class="calrow" style="flex:1">${segs}</div></div>`);
  }
  const anyIrr = rot.schedule.some(s=>s.irrigation==="refill_on_stress");
  const anyPond = rot.schedule.some(s=>s.irrigation==="ponded");
  return `<div class="cal">
    <div style="display:flex"><span class="caltag"></span>
      <div class="months" style="flex:1">${MONTHS.map(m=>`<span>${m}</span>`).join("")}</div></div>
    ${rows.join("")}
    <div class="callegend">
      ${anyIrr?"<span>diagonal hatch = irrigated</span>":""}
      ${anyPond?"<span>fine vertical hatch = flooded paddy</span>":""}
      <span>gaps = bare ground</span></div></div>`;
}

/* --------------------------------------------------------- 3. Compare */
function screenCompare(){
  const b = state.bundle, rank = state.rank;
  const mine = rank.existing;
  const picks = [];
  if(state.selected !== null){
    const fromRank = rank.ranked.find(r=>r.index===state.selected);
    const raw = b.rotations.find(r=>r.index===state.selected);
    if(raw && !raw.is_existing) picks.push(fromRank || toRanked(raw));
  }
  rank.ranked.forEach(r => {
    if(!r.is_existing && picks.length < 2 && !picks.some(p=>p.index===r.index)) picks.push(r);
  });

  const cols = [];
  if(mine) cols.push({r:mine, label:"Your rotation now", cls:"base"});
  picks.forEach((r,i) => cols.push({
    r, label: i===0 ? "Recommended" : "Runner-up", cls: i===0 ? "pick" : ""}));

  const objs = b.objectives;
  const bestOf = {};
  objs.forEach(o => {
    const vals = cols.map(c=>c.r.objectives[o.key]).filter(v=>v!==undefined);
    if(vals.length) bestOf[o.key] = o.maximise ? Math.max(...vals) : Math.min(...vals);
  });

  return `
    <p class="lede">Your current rotation beside the options FieldShift ranks highest
      for the priorities you set. Same field, same weather, same soil — the only
      difference is what gets planted and when.</p>
    ${tierBanner(b.region||{validated:true})}

    <div class="cmp">${cols.map(c => {
      const rot = b.rotations.find(x=>x.index===c.r.index);
      return `<div class="col ${c.cls}">
        <div class="ch"><div class="cl">${esc(c.label)}</div>
          <h4>${esc(c.r.name.replace(/^EXISTING: /,""))}</h4></div>
        <div class="cb">
          ${objs.map(o => {
            const v = c.r.objectives[o.key];
            if(v===undefined) return "";
            const m = PLAIN[o.key] || {u:o.units, d:2};
            const shown = o.key==="bare_ground" ? fmt(v*100,0)+"%" : fmt(v, m.d);
            const best = cols.length>1 && Math.abs(v-bestOf[o.key])<1e-9;
            return `<div class="m"><span>${esc(m.k||o.label)}</span>
              <b class="${best?"best":""}">${shown}${o.key==="bare_ground" ? ""
                : ` <small>${esc(m.u||o.units)}</small>`}</b></div>`;
          }).join("")}
          <div class="m"><span>harvests/decade</span>
            <b>${fmt(c.r.detail.crops_per_decade,1)}</b></div>
          ${rot?calendar(rot):""}
        </div></div>`;
    }).join("")}</div>

    ${cols.length>1 ? `<p class="srcnote">Green marks the best value in each row.
      All ${objs.length} measures are shown, because a single blended score would
      hide the trade-off that matters.</p>` : ""}

    <div class="row">
      ${state.selected!==null ? `<button class="primary"
        onclick="window.open('/api/site/${state.siteId}/rotation/${state.selected}/fieldplan','_blank')">
        Print the field plan</button>` : ""}
      <button class="ghost" onclick="go('evidence')">See the evidence behind this</button>
      <button class="ghost" onclick="go('rotations')">Back to all rotations</button>
    </div>`;
}

function toRanked(rot){
  return {index:rot.index, name:rot.name, score:0, is_existing:rot.is_existing,
    on_front:rot.on_front, objectives:rot.objectives, detail:rot.detail};
}

/* -------------------------------------------------------- 4. Evidence */
function currentIndex(){
  if(state.selected !== null) return state.selected;
  return state.rank && state.rank.ranked.length ? state.rank.ranked[0].index : null;
}

function screenEvidence(){
  const idx = currentIndex();
  if(idx === null) return `<div class="skel">No rotation selected.</div>`;
  const rot = state.bundle.rotations.find(r=>r.index===idx);
  return `
    <p class="lede">An evidence card for every recommendation: the datasets behind it,
      how coarse each one is, what the model cannot see, and who needs to check it.
      <b>Click any card to turn it over.</b></p>
    <div class="sec"><h3>${esc((rot?rot.name:"").replace(/^EXISTING: /,""))}</h3>
      <div class="rule"></div></div>
    <div id="evbody"><div class="skel">Loading evidence&hellip;</div></div>`;
}

async function loadEvidence(){
  const idx = currentIndex();
  if(idx === null) return;
  const host = () => document.getElementById("evbody");
  try{
    const ev = await get(`/api/site/${state.siteId}/rotation/${idx}/evidence`);
    if(!host()) return;
    const c = ev.card;
    const conf = c.confidence;
    const cls = conf==="high"?"good":conf==="medium"?"warn":"bad";
    const limiting = (c.limiting_sources||[]).map(x=>x.name||x);
    const srcFlips = (c.sources||[]).map(s => {
      const ratio = s.mismatch_ratio;
      const scale = (ratio===null||ratio===undefined) ? "field scale"
        : ratio < 1 ? "finer than this field"
        : `${fmt(ratio,0)}× this field's area`;
      const isLim = limiting.includes(s.name);
      return flip(isLim?"partial":"pass", "Data source", s.name, scale,
        `<p>${esc(s.role)}</p>
         <p style="color:var(--muted)">${esc(s.variables)} · ${esc(s.period)}</p>
         ${s.caveat?`<p><b>Caveat.</b> ${esc(s.caveat)}</p>`:""}
         ${isLim?`<p style="color:var(--warn)"><b>This is what caps the confidence of
           this card.</b> Improving anything else cannot raise it.</p>`:""}`,
        `${esc(s.confidence)} confidence`);
    }).join("");

    host().innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="pill ${cls}"><span class="dot"></span>${esc(conf)} confidence</span>
          ${limiting.length?`<span style="font-size:12.5px;color:var(--muted)">capped by
            <b style="color:var(--ink)">${limiting.map(esc).join(", ")}</b></span>`:""}
        </div>
        <p class="srcnote">Confidence is the weakest input, not an average. Averaging
          would let a good dataset launder a bad one.</p>
      </div>

      <div class="sec"><h3>Where the numbers come from</h3><div class="rule"></div></div>
      <div class="flips">${srcFlips}</div>

      ${(c.unknowns||[]).length?`
      <div class="sec"><h3>What this does not account for</h3><div class="rule"></div></div>
      <div class="card ev"><ul>${c.unknowns.map(u=>`<li>${esc(u)}</li>`).join("")}</ul></div>`:""}

      ${(c.needs_local_review||[]).length?`
      <div class="sec"><h3>Needs someone with local knowledge</h3><div class="rule"></div></div>
      <div class="card ev"><ul>${c.needs_local_review.map(u=>`<li>${esc(u)}</li>`).join("")}</ul>
      <p class="srcnote">Each of these is a question a person in the district can
        answer, and answering them is the fastest route to a better number.</p></div>`:""}

      <div class="card"><details class="raw">
        <summary>The whole evidence card as plain text — this is what prints on the
          field plan</summary><pre>${esc(ev.rendered)}</pre></details></div>`;
    wireFlips();
  }catch(e){
    if(host()) host().innerHTML = `<div class="alert">${esc(e.message)}</div>`;
  }
}

/* ------------------------------------------------------ 5. Validation */
function screenValidation(){
  const v = state.validation;
  if(!v) return `<div class="alert">No validation record found on disk.</div>`;
  const reg = state.bundle.region || {tier:1, validated:true};
  const checks = v.checks;
  const pass = checks.filter(c=>c.verdict==="pass").length;

  const cards = checks.map(c => flip(
    c.verdict,
    c.verdict==="pass" ? "Passed" : c.verdict==="partial" ? "Partly passed" : "Not validated",
    c.title, c.result,
    `<p><b>${esc(c.question)}</b></p>
     <p>${esc(c.detail)}</p>
     <p style="color:var(--muted)">Checked against ${esc(c.against)}.</p>
     <p>Reproduce: <code>${esc(c.reproduce)}</code></p>`,
    `tier ${c.tier}`)).join("");

  const bugs = v.bugs_found.map(b => `
    <div class="card raise">
      <h3>${esc(b.title)}</h3>
      <p style="font-size:12.8px;color:var(--bad);margin:0 0 7px">
        <b>Effect:</b> ${esc(b.effect)}</p>
      <p style="font-size:12.6px;color:var(--ink-2);margin:0">${esc(b.how)}</p>
    </div>`).join("");

  return `
    <p class="lede">Most of the work on FieldShift went here rather than into features.
      A crop-rotation model that has not been checked against observation is a
      plausible-looking opinion, so this is the whole record — including the check
      we do <b>not</b> pass, and the ${v.bugs_found.length} errors that checking found
      in our own model. <b>Click any card to turn it over.</b></p>

    <div class="facts">
      <div class="f"><div class="k">Checks passed</div>
        <div class="v">${pass} of ${checks.length}
        <small>one partial, one not applicable to this tier</small></div></div>
      <div class="f"><div class="k">Errors validation found</div>
        <div class="v">${v.bugs_found.length}
        <small>in our own model, all listed below</small></div></div>
      <div class="f"><div class="k">This field's tier</div>
        <div class="v">Tier ${reg.tier}<small>${reg.validated
          ? "validated against observed yields"
          : "transferred, unvalidated"}</small></div></div>
    </div>

    <div class="sec"><h3>Every check we ran</h3><div class="rule"></div></div>
    <div class="flips">${cards}</div>

    <div class="sec"><h3>What validation found wrong in our own model</h3>
      <div class="rule"></div></div>
    <p class="lede">Each of these was producing confident, plausible output before it
      was caught. They are listed because a model whose authors cannot name its past
      errors has probably not looked for them.</p>
    <div class="grid2">${bugs}</div>

    <div class="sec"><h3>A claim we withdrew</h3><div class="rule"></div></div>
    <div class="alert">
      <b>We once claimed an 18% high bias in our reference ET.</b> It came from a
      half-remembered climatology figure rather than from a dataset. When gridMET was
      actually fetched and compared, the real bias was <b>−3.2%</b>. The claim was
      withdrawn and a standing rule adopted: a validation target must be a dataset we
      fetched or a citation we can point at — never a remembered number. Every
      figure on this page has a command beside it that reproduces it.</div>`;
}

/* ------------------------------------------------------ flip cards */
function flip(kind, tag, title, value, back, meta){
  return `<div class="flip ${esc(kind)}" role="button" tabindex="0"
      aria-label="${esc(title)} — activate to see details"><div class="inner">
    <div class="face front">
      <div class="ft">${esc(tag)}</div>
      <h4>${esc(title)}</h4>
      <div class="fv">${esc(value)}</div>
      <div class="fm"><span>${esc(meta||"")}</span>
        <span class="turn">turn over ↻</span></div>
    </div>
    <div class="face back">
      <div class="ft">${esc(title)}</div>
      <div class="fd">${back}</div>
      <div class="fm"><span>${esc(meta||"")}</span>
        <span class="turn">back ↺</span></div>
    </div></div></div>`;
}

function wireFlips(){
  document.querySelectorAll(".flip").forEach(el => {
    el.onclick = () => el.classList.toggle("on");
    el.onkeydown = e => {
      if(e.key===" " || e.key==="Enter"){ e.preventDefault(); el.classList.toggle("on"); }
    };
  });
}

boot();
</script>
</body>
</html>
